methods:
  - schema_version: 1
    method_id: godot-ui-structure-review
    title: Godot UI structure review
    purpose: Validate that Control layout and focus behavior are container-driven, responsive, and testable in the target scene.
    applicable_capability_ids:
      [ui_engineering, controller_navigation, godot_development]
    steps:
      - Identify the active Control hierarchy, containers, anchors, and size flags.
      - Trace focus neighbors and declared input actions.
      - Verify behavior at target viewport sizes with runtime capture.
    evidence_requirements:
      - Active .tscn or runtime scene path.
      - Runtime capture for layout and focus claims.
    source_ids: [godot-control-docs, godot-containers-docs]
items:
  - schema_version: 1
    item_id: godot-ui-container-layout
    title: Prefer container-owned layout
    kind: professional_knowledge
    statement: Use Control containers, anchors, and size flags to express responsive layout; avoid treating fixed editor coordinates as the layout contract.
    domain_ids: [godot, game_ui]
