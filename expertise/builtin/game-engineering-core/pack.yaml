    confidence: 0.94
  - schema_version: 1
    item_id: engineering-no-structural-overclaim
    title: Structural inspection is bounded evidence
    kind: anti_pattern
    statement: Readable source and configuration establish discoverability, not runtime correctness, performance, or player-facing quality.
    domain_ids: [engineering, qa]
    capability_ids: [dependency_analysis, build_engineering]
