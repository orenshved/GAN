  - schema_version: 1
    item_id: engineering-small-slice
    title: Prefer a coherent vertical slice
    kind: heuristic
    statement: A small end-to-end behavior with evidence is safer than broad disconnected scaffolding.
    domain_ids: [engineering, production]
