methods:
  - schema_version: 1
    method_id: engineering-change-plan
    title: Bounded engineering change plan
    purpose: Connect a requested behavior to the smallest safe ownership boundary and verification path.
    applicable_capability_ids:
      [ui_engineering, gameplay_engineering, tooling, build_engineering]
    steps:
      - Identify the authoritative contract and current implementation boundary.
      - Trace dependencies and state transitions before editing.
      - Implement the smallest coherent slice and verify its observable contract.
    evidence_requirements:
      - Cited project files or contracts.
      - Deterministic checks plus runtime evidence where behavior is claimed.
    source_ids: [gan-engineering-invariants, gan-evidence-contract]
  - schema_version: 1
    method_id: dependency-boundary-review
    title: Dependency boundary review
    purpose: Prevent infrastructure and adapter concerns from becoming domain truth.
    applicable_capability_ids: [dependency_analysis, tooling, build_engineering]
    steps:
      - Map ownership and dependency direction.
      - Identify imports or writes that cross the declared boundary.
      - Verify the corrected boundary with automated checks.
    evidence_requirements:
      - Current dependency graph or source imports.
      - A repeatable boundary test.
    source_ids: [gan-engineering-invariants]
items:
  - schema_version: 1
    item_id: engineering-contract-first
    title: Contracts own cross-boundary meaning
    kind: professional_knowledge
    statement: Change the canonical domain contract before generated clients or boundary consumers, then regenerate and verify drift.
    domain_ids: [engineering]
