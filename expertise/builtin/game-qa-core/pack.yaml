        accessibility_qa,
      ]
methods:
  - schema_version: 1
    method_id: claim-evidence-matrix
    title: Claim-to-evidence matrix
    purpose: Match each completion claim to evidence capable of proving it and an eligible evaluator.
    applicable_capability_ids:
      [
        functional_testing,
        automated_testing,
        ux_testing,
        visual_regression,
        accessibility_qa,
      ]
    steps:
      - State the exact technical, visual, subjective, or fun claim.
      - Select independent deterministic, measured, comparative, heuristic, or human evidence.
      - Record missing evidence, evaluator authority, and the resulting gate state.
    evidence_requirements:
      - Inspectable evidence with producer, origin, digest, time, and scope.
      - Human judgment for subjective acceptance.
    source_ids: [gan-qa-policy]
items:
  - schema_version: 1
    item_id: qa-claim-specific
    title: Evidence must fit the claim
    kind: professional_knowledge
    statement: A gate may pass only when its evidence class and producer can establish the exact claim under review.
    domain_ids: [qa]
    capability_ids:
      [
        functional_testing,
        automated_testing,
        ux_testing,
        visual_regression,
        accessibility_qa,
      ]
    source_ids: [gan-qa-policy]
    method_ids: [claim-evidence-matrix]
    freshness_class: stable
    confidence: 0.99
  - schema_version: 1
    item_id: qa-model-not-ground-truth
    title: Model opinion is heuristic
    kind: anti_pattern
    statement: A model may interpret independent evidence but cannot become the source of runtime, visual, accessibility, or fun evidence it did not observe.
    domain_ids: [qa]
    capability_ids: [ux_testing, visual_regression, accessibility_qa]
    source_ids: [gan-qa-policy]
    method_ids: [claim-evidence-matrix]
    freshness_class: stable
    confidence: 0.99
  - schema_version: 1
    item_id: qa-missing-is-visible
    title: Missing evidence stays visible
    kind: standard
    statement: Inconclusive or absent evidence blocks the affected claim unless the Director records an explicit scoped waiver.
    domain_ids: [qa, production]
    capability_ids: [functional_testing, automated_testing]
    source_ids: [gan-qa-policy]
    method_ids: [claim-evidence-matrix]
    freshness_class: stable
    confidence: 0.99
evaluation_ids: [qa-method-contract, qa-independence-contract]
