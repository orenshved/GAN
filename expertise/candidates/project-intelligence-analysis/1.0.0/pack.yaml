  - schema_version: 1
    item_id: pia-stable-complexity-not-a-priority
    title: Complex-but-stable code is not automatically a priority
    kind: anti_pattern
    statement: Code that is difficult to read but rarely or never changes is not currently costing ongoing development effort; treating all complex code as equally urgent, regardless of how often it actually changes, misdirects limited investigation or refactoring effort.
    domain_ids: [engineering]
    capability_ids: [project_analysis]
    source_ids: [understandlegacycode-hotspots]
    method_ids: [hotspot-prioritization-review]
    freshness_class: stable
    confidence: 0.85
  - schema_version: 1
    item_id: pia-circular-dependency-is-findable
    title: A circular dependency is a specific, findable structural risk
    kind: professional_knowledge
    statement: A cycle in a codebase's dependency graph, where two or more modules depend on each other directly or transitively, is a concrete, identifiable structural problem, distinct from a vaguer impression that the code feels tangled; it should be named and traced specifically, not just noted as a general concern.
    domain_ids: [engineering]
    capability_ids: [dependency_analysis]
    source_ids: [understandlegacycode-dependency-graphs]
    method_ids: [dependency-graph-comprehension-review]
    freshness_class: stable
    confidence: 0.87
  - schema_version: 1
    item_id: pia-dense-cluster-signals-absorbed-responsibility
    title: A dependency cluster with too many connections signals absorbed responsibility
    kind: standard
    statement: A single module or class with disproportionately many incoming or outgoing dependencies compared to the rest of the codebase is a concrete signal that it has absorbed responsibilities that belong elsewhere, findable directly from the dependency graph's structure rather than only from reading its code.
    domain_ids: [engineering]
    capability_ids: [dependency_analysis]
    source_ids: [understandlegacycode-dependency-graphs]
    method_ids: [dependency-graph-comprehension-review]
    freshness_class: stable
