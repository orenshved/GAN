  - schema_version: 1
    item_id: pia-start-with-simple-sketch
    title: Start dependency mapping with a simple sketch, not a comprehensive tool
    kind: heuristic
    statement: Beginning dependency analysis with a hand-drawn or simple sketch of the major relationships, and only reaching for a comprehensive automated graphing tool once complexity exceeds what can be tracked manually, avoids over-investing tooling effort before the actual scope of the problem is understood.
    domain_ids: [engineering]
