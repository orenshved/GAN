    item_id: pia-prioritize-complexity-times-churn
    title: Prioritize by complexity crossed with change frequency, not either alone
    kind: professional_knowledge
    statement: The parts of a codebase most worth investigating or improving are the ones that are both complex and frequently changed; complexity alone can describe code that is stable and not currently costing anyone anything, while frequent change alone can describe simple code that is not actually risky.
