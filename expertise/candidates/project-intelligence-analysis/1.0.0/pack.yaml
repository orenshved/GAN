methods:
  - schema_version: 1
    method_id: hotspot-prioritization-review
    title: Hotspot prioritization review
    purpose: Prioritize where to focus investigation or improvement effort in an unfamiliar codebase by combining code complexity with git-history change frequency, rather than by complexity or activity alone.
    applicable_capability_ids: [project_analysis, dependency_analysis]
    steps:
      - Identify the codebase's highest-complexity files, for example by cyclomatic complexity or an equivalent static-analysis measure.
      - Identify the codebase's most frequently changed files over a representative recent period, using version-control history.
      - Compare both dimensions per file; treat files that are both complex and frequently changed as the priority, not files that are merely complex.
      - Explicitly deprioritize complex-but-stable code; code that never changes is not currently costing ongoing effort, regardless of how hard it might be to read.
    evidence_requirements:
      - The actual complexity measurements and change-frequency data used, not an impression that code "looks messy."
      - The specific time window used for the change-frequency history.
    source_ids: [understandlegacycode-hotspots]
  - schema_version: 1
    method_id: dependency-graph-comprehension-review
    title: Dependency graph comprehension review
    purpose: Build and read a dependency graph of an unfamiliar codebase to find genuine structural risks, such as circular dependencies and disproportionately connected modules, rather than relying on a linear read-through of files.
    applicable_capability_ids: [dependency_analysis]
    steps:
      - Start with a simple sketch of major module dependencies rather than immediately reaching for a comprehensive automated tool.
      - Look specifically for circular dependencies between modules; a cycle in the dependency graph indicates entanglement that will resist safe incremental change.
      - Look for a module with disproportionately many incoming or outgoing connections; a dense cluster of dependencies often indicates a module that has absorbed too many responsibilities.
      - When incremental restructuring is planned, record each newly discovered prerequisite dependency as it is found, rather than trying to plan the entire restructuring up front.
      - Share the dependency graph with the team, for example in a pull request description, rather than keeping the analysis as private working notes.
    evidence_requirements:
      - The actual dependency graph or matrix produced for the codebase or module under review.
      - Any circular dependencies or unusually dense clusters identified, named explicitly.
    source_ids: [understandlegacycode-dependency-graphs]
