schema_version: 1
pack_id: game-production-core
name: Game Production Core
version: 1.0.0
description: >-
  Sprint-scoped production planning, explicit completion criteria, and
  visible risk/impediment tracking for game production, grounded in the
  Scrum Guide. `dependency_management` is intentionally the thinnest
  capability here — Scrum covers single-team impediment surfacing but not
  multi-team dependency scheduling; a dedicated cross-discipline coordination
  source is a candidate for a future version.
state: draft
