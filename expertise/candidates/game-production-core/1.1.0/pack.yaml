version: 1.1.0
description: >-
  Sprint-scoped production planning, explicit completion criteria, and
  visible risk/impediment tracking for game production, grounded in the
  Scrum Guide's generic framework plus a shipped-title producer's concrete,
  game-specific practices: single-discipline sprint meetings, relative task
  sizing, actively protected sustainable pace, and structured onboarding.
  `dependency_management` remains the thinnest capability — neither source
  covers multi-team dependency *scheduling* specifically, only impediment
  surfacing and onboarding-driven dependency reduction; a dedicated
  cross-discipline coordination source is still a candidate for a future
  version.
