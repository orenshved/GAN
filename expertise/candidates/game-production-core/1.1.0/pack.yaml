methods:
  - schema_version: 1
    method_id: sprint-scoped-production-planning
    title: Sprint-scoped production planning
    purpose: Plan and track game production work in fixed-length increments with an inspectable backlog and explicit exit criteria, instead of open-ended scope against a bare date.
    applicable_capability_ids:
      [production_planning, milestone_planning, scope_management]
    steps:
      - Define the Sprint Goal and the Sprint Backlog — exactly which backlog items the increment commits to.
      - Set a fixed increment length and a Definition of Done the increment must meet before it can be called complete.
      - Track progress against the backlog continuously and surface blocking impediments as they appear, not only at the review.
      - At the retrospective, record what changes for the next increment's planning, distinct from what shipped in this one.
    evidence_requirements:
      - The current backlog for the increment and its Definition of Done.
      - The increment's actual start/end and what was delivered against the plan.
    source_ids: [scrum-guide-2020]
  - schema_version: 1
    method_id: risk-and-impediment-review
    title: Risk and impediment review
    purpose: Surface production risks and cross-discipline blockers explicitly and often, instead of discovering them at a milestone deadline.
    applicable_capability_ids: [risk_management, dependency_management]
    steps:
      - Identify current impediments blocking committed work, including cross-discipline dependencies such as art blocked on an engineering pipeline.
      - Distinguish an increment-level impediment (blocks the current commitment) from a longer-range risk (threatens a later milestone).
      - Record each impediment's owner and whether it is visibly tracked or still informal.
      - Re-inspect open impediments at the next check-in rather than letting them go stale between updates.
    evidence_requirements:
      - The current impediment/risk list with an owner per item.
      - Whether each impediment has been re-inspected since it was raised.
    source_ids: [scrum-guide-2020]
  - schema_version: 1
    method_id: sprint-discipline-and-estimation-review
    title: Sprint discipline and estimation review
    purpose: Keep sprint-planning meetings focused and estimation practical by limiting meeting scope to a single discipline and using relative sizing instead of precise hour estimates.
    applicable_capability_ids: [production_planning, scope_management]
    steps:
      - Limit each sprint-planning or check-in meeting to a single discipline's own work and a small attendee count, rather than mixing multiple disciplines into one meeting.
      - Use a relative sizing scale, for example extra-small through extra-large, for task estimates instead of demanding precise hour or day estimates upfront.
      - Allow size estimates to be revised as a task's actual scope becomes clearer, rather than treating the initial estimate as fixed.
      - Confirm meeting attendees are the people who actually need to make decisions about the discussed work, not a broad audience kept only for visibility.
    evidence_requirements:
      - The actual attendee list and discipline composition of a sprint meeting under review.
      - The estimation scale being used and evidence that estimates are revisited, not fixed at first guess.
    source_ids: [sandercock-production-secrets]
  - schema_version: 1
    method_id: sustainable-pace-onboarding-review
    title: Sustainable pace and onboarding review
    purpose: Confirm a production plan actively protects sustainable working hours and gives new or remote team members a structured path to becoming productive, rather than assuming these will happen informally.
    applicable_capability_ids: [risk_management, dependency_management]
    steps:
      - Check whether the plan actively discourages routine overtime rather than silently tolerating or expecting it as normal.
      - Look for a simple daily practice, such as a brief end-of-day check-out of completed work, that makes actual pace visible to leads without requiring overtime to hit a milestone.
      - For new or remote hires, confirm a structured onboarding path exists, with specific tasks for day one, week one, and month one, rather than an unstructured ramp-up.
      - Confirm new hires have a specific peer point of contact for questions, independent of their manager and independent of discipline.
    evidence_requirements:
      - Whether overtime is discouraged in practice, not just in policy language.
      - The actual onboarding task list or schedule given to a recent new hire, if one exists.
    source_ids: [sandercock-production-secrets]
items:
  - schema_version: 1
    item_id: production-explicit-done
    title: Increments need an explicit Definition of Done
    kind: professional_knowledge
    statement: A milestone or increment is only "done" when it meets an explicit, shared Definition of Done; without one, "done" silently means something different to each discipline reporting on it.
    domain_ids: [production, game_production]
    capability_ids: [production_planning, milestone_planning]
    source_ids: [scrum-guide-2020]
    method_ids: [sprint-scoped-production-planning]
    freshness_class: slow_changing
    confidence: 0.95
  - schema_version: 1
    item_id: production-scope-change-via-backlog
    title: Scope changes belong in backlog refinement, not mid-increment
    kind: standard
    statement: New or changed scope should enter the backlog and be prioritized there; pulling new work into an already-committed increment without adjusting its goal undermines the increment's own exit criteria.
    domain_ids: [production]
    capability_ids: [scope_management, production_planning]
    source_ids: [scrum-guide-2020]
    method_ids: [sprint-scoped-production-planning]
    freshness_class: slow_changing
    confidence: 0.92
  - schema_version: 1
    item_id: production-date-without-done-is-not-a-plan
    title: A milestone date without a Definition of Done is not a plan
    kind: anti_pattern
    statement: Naming a ship date without an explicit, shared completion criterion is a deadline, not a production plan; it hides disagreement about what "finished" means until the date arrives.
    domain_ids: [production]
    capability_ids: [milestone_planning, risk_management]
    source_ids: [scrum-guide-2020]
    method_ids: [sprint-scoped-production-planning]
    freshness_class: slow_changing
    confidence: 0.93
  - schema_version: 1
    item_id: production-impediment-owner-and-recheck
    title: Impediments need an owner and a re-inspection point
    kind: professional_knowledge
    statement: A risk or cross-discipline dependency that is logged once but never re-inspected functions the same as an unlogged one; it needs an explicit owner and a recurring check-in until it is resolved.
    domain_ids: [production]
    capability_ids: [risk_management, dependency_management]
    source_ids: [scrum-guide-2020]
    method_ids: [risk-and-impediment-review]
    freshness_class: slow_changing
    confidence: 0.9
  - schema_version: 1
    item_id: production-single-discipline-meetings-stay-focused
    title: Single-discipline sprint meetings stay focused
    kind: professional_knowledge
    statement: Limiting a sprint-planning or check-in meeting to one discipline's own work and a small attendee count keeps the discussion relevant to everyone present; mixing multiple disciplines into one meeting means most attendees sit through work that is not theirs.
    domain_ids: [production, game_production]
    capability_ids: [production_planning, scope_management]
    source_ids: [sandercock-production-secrets]
    method_ids: [sprint-discipline-and-estimation-review]
    freshness_class: stable
    confidence: 0.85
  - schema_version: 1
    item_id: production-relative-sizing-is-revisable
    title: Relative sizing estimates are meant to be revised
    kind: standard
    statement: A relative-sizing estimate, such as extra-small through extra-large, is a starting judgment, not a fixed commitment; treating an early size estimate as unchangeable defeats the purpose of using a rough scale instead of a precise one.
    domain_ids: [production]
    capability_ids: [production_planning, milestone_planning]
    source_ids: [sandercock-production-secrets]
    method_ids: [sprint-discipline-and-estimation-review]
    freshness_class: stable
    confidence: 0.83
  - schema_version: 1
    item_id: production-sustainable-pace-is-active
    title: Sustainable pace is actively protected, not assumed
    kind: professional_knowledge
    statement: Avoiding routine overtime requires active practices, such as leads modeling reasonable hours and a simple daily visibility check on completed work, rather than a policy statement alone; without an active practice, crunch tends to become the default under schedule pressure.
    domain_ids: [production]
    capability_ids: [risk_management, production_planning]
    source_ids: [sandercock-production-secrets]
    method_ids: [sustainable-pace-onboarding-review]
    freshness_class: stable
    confidence: 0.86
  - schema_version: 1
    item_id: production-structured-onboarding-path
    title: New hires need a structured, staged onboarding path
    kind: standard
    statement: A specific task list for a new or remote hire's first day, first week, and first month gets them productive faster and more reliably than an unstructured ramp-up, and should be paired with a peer contact independent of their manager for day-to-day questions.
    domain_ids: [production]
    capability_ids: [dependency_management, production_planning]
    source_ids: [sandercock-production-secrets]
    method_ids: [sustainable-pace-onboarding-review]
    freshness_class: stable
    confidence: 0.84
