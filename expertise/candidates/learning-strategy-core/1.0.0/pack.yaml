methods:
  - schema_version: 1
    method_id: cognitive-load-aware-teaching-design-review
    title: Cognitive load aware teaching design review
    purpose: Check that how a new concept or skill is taught to an agent respects working memory's real limits and the learner's actual existing expertise, rather than following one fixed teaching method regardless of context.
    applicable_capability_ids: [instructional_design]
    steps:
      - Check whether new material is sequenced from simple to complex and from low-fidelity to high-fidelity practice, rather than presenting full task complexity immediately, since intrinsic load, the difficulty inherent to a task from how much its components depend on each other, is best managed by incremental exposure, not by simplifying the content's actual substance.
      - Check whether a worked example, a full demonstration of a typical problem being solved end to end, precedes any request for independent problem-solving on a genuinely new task type, since presenting an unsolved problem before a learner has any solution template to draw on adds load that has nothing to do with learning the target skill.
      - Check whether related visual and verbal information, a diagram and its explanation, an interface and its instructions, are physically or temporally integrated rather than presented separately, since forcing a learner to mentally cross-reference two separated sources consumes working memory that could otherwise go toward the actual material, this is the split-attention effect.
      - Check whether the same teaching method is being reused for a learner who has already automated the relevant schema, rather than adapted for their now-higher expertise, since a method that helps a novice, heavy scaffolding, worked examples, redundant explanation, can measurably slow down or actively hinder someone who already has a working model, this is the expertise reversal effect.
    evidence_requirements:
      - Whether new material is sequenced by increasing complexity and fidelity, or presented at full difficulty immediately.
      - Whether the learner's existing expertise level was accounted for in choosing the teaching method, rather than one method applied uniformly regardless of prior experience.
    source_ids: [ghanbari-cognitive-load-theory-review-2020]
  - schema_version: 1
    method_id: durable-skill-and-knowledge-development-review
    title: Durable skill and knowledge development review
    purpose: Check that a claim or plan about building an agent's skill through practice matches what the evidence actually supports, rather than the popularized, overstated version of deliberate practice research.
    applicable_capability_ids: [knowledge_retention]
    steps:
      - Check whether a claim that more practice or repetition alone will produce expertise is treated as the complete explanation, rather than one contributing factor among several, since the strongest available meta-analytic evidence puts structured practice's share of performance variance at roughly 14 to 40 percent depending on the domain, with the rest explained by factors such as general ability, developmental timing, and the diversity of prior experience.
      - Check whether practice referenced in a specific plan is actually structured, with a clear target skill and a feedback mechanism, rather than simply repeated exposure or unstructured repetition, since the evidence for the stronger, more selective form of practice does not transfer to repetition without those structural elements.
      - Check whether a plan for improving a specific skill names a mechanism for closing the loop, identifying where performance actually fell short and correcting specifically that, rather than only scheduling more repetitions of the same activity, since undirected repetition has documented, weaker evidence behind it than practice that specifically targets an identified weakness.
      - Be skeptical of any claim asserting a fixed, universal amount or ratio of practice needed to reach a level of skill, since the underlying research this kind of claim is usually drawn from has itself been shown to shift its own definitions and inclusion criteria across publications, a documented pattern that undermines treating any single number as a reliable target.
    evidence_requirements:
      - Whether a practice or repetition recommendation specifies what feedback mechanism will identify and correct actual shortfalls, not just more repetition of the same task.
      - Whether a claim about how much practice is needed cites a specific, checkable evidence basis, rather than a popularized rule of thumb.
    source_ids: [hambrick-deliberate-practice-review-2020]
  - schema_version: 1
    method_id: structured-agent-onboarding-review
    title: Structured agent onboarding review
    purpose: Check that a newly joined agent or subagent has a staged, supported ramp-up path with early visibility into its progress, rather than being handed the full scope of its role with no structure.
    applicable_capability_ids: [agent_onboarding]
    steps:
      - Check whether a new agent or subagent joining a task has a structured onboarding path with specific expectations for its first task, its first few tasks, and its first sustained period of work, rather than being given the full scope of its role immediately with no staged ramp-up.
      - Check whether a new agent has a specific point of contact for questions that is independent of whoever assigned it the task, since routing every question back through the same assigning authority creates a bottleneck and discourages asking smaller clarifying questions early, when they are cheapest to resolve.
      - Check whether the onboarding path's early tasks are chosen specifically to build confidence and orientation, real but genuinely scoped-down work, rather than either trivial busywork disconnected from the actual role or the same full-complexity work an experienced agent would be given.
      - Check whether there is a lightweight daily or per-task checkpoint that makes actual progress and blockers visible early, rather than only being discovered at a milestone review, since a structured checkpoint surfaces a stuck or confused new agent while the fix is still cheap.
    evidence_requirements:
      - Whether a documented staged onboarding path exists for a new agent, with specific early-stage tasks, rather than immediate full-scope assignment.
      - Whether a new agent has an identified point of contact separate from its assigning authority.
    source_ids: [sandercock-production-secrets]
