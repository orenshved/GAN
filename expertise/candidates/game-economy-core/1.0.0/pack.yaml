methods:
  - schema_version: 1
    method_id: sink-faucet-flow-monitoring-review
    title: Sink and faucet flow monitoring review
    purpose: Check that a currency's economic health is judged from issuance versus collection flow over time, not from a single point-in-time stock snapshot, so an inflation trend is caught while it is still forming.
    applicable_capability_ids: [economy_analysis, balance_simulation]
    steps:
      - Check that each currency's daily issuance, its faucet output, is tracked against its daily collection, its sink intake, rather than net stock alone, since a persistent gap between the two compounds into a much larger stock swing before it becomes visible in prices.
      - For a currency produced or collected through more than one channel, break the flow down by individual channel rather than by currency alone, since a stock anomaly that looks identical on an aggregate chart can have entirely different root causes depending on which specific channel actually moved.
      - Check whether currencies with different acquisition paths, such as one obtained primarily by purchase and one obtained primarily by played time, are modeled and monitored separately rather than folded into one aggregate, since collapsing them together obscures which lever an intervention should actually pull.
      - Confirm that supply monitoring includes currency held by inactive or lapsed players, not only actively circulating balances, since a successful win-back or marketing campaign can release a large stock of previously idle currency all at once and this shows up as a genuine inflation trigger.
    evidence_requirements:
      - Daily issuance versus collection for each currency, broken down by individual channel, not just an aggregate stock total.
      - Whether the monitoring model accounts for currency balances held by inactive or lapsed accounts.
    source_ids: [netease-inflation-monitoring-gdc2020]
  - schema_version: 1
    method_id: economic-integrity-and-fairness-policy-review
    title: Economic integrity and fairness policy review
    purpose: Check that a design or operational decision preserves a level playing field where progression and items are earned through in-game play, rather than through real money, fame, or an unrelated economy's holdings.
    applicable_capability_ids: [economy_design]
    steps:
      - Check whether any mechanism lets a player convert real-world money, real-world fame or audience, or holdings from an unrelated economy or an earlier season into in-economy progression or items faster than normal play would allow, since pay-for-advantage purchases, streamer or community item gifting, and cross-season or cross-economy carryover are all functionally equivalent to real-money trading even when no cash literally changes hands.
      - Check what policy governs restoring lost or stolen items and progression through customer support, since a restoration policy is a standing invitation for players to fabricate a hack or theft claim in order to duplicate their own items, and support staff can rarely verify what actually happened at the level of detail required to tell a real theft from a staged one.
      - Check that the response to a discovered exploit is a full economy-wide fix or rollback rather than one scoped only to the accounts believed to be affected, since a partial response leaves open the chance that exploited items already reached other players through ordinary trading, and inconsistent treatment across accounts is itself perceived as unfair.
      - Check whether any operational decision grants a bypass, a head start, or an exception to a specific player or group ahead of the normal earn path, however small or well-intentioned it seems, since even a short, unintentional head start is a genuine integrity breach rather than a negligible edge case.
    evidence_requirements:
      - A written statement of what does and does not count as pay-for-advantage in this economy, including edge cases such as early access and streamer or community gifting.
      - The customer-support policy for restoring lost, stolen, or duplicated items and progression, and who is authorized to approve an exception to it.
    source_ids: [wilson-protecting-economic-integrity-2026]
  - schema_version: 1
    method_id: economic-anomaly-and-manipulation-detection-review
    title: Economic anomaly and manipulation detection review
    purpose: Check that suspicious trading activity is identified from transaction network structure and price behavior, not from transaction size alone, so genuine high-volume players are not confused with manipulators.
    applicable_capability_ids: [economy_analysis, balance_simulation]
    steps:
      - Track the exchange rate between currencies with different acquisition paths over time using price and volume data comparable to a trading chart, since a currency whose exchange rate is moving sharply, rather than staying roughly stable, signals a supply and demand imbalance well before it would show up in a top-line stock chart.
      - When a large-volume trade on a specific item or currency is detected, classify its likely intent before responding, such as an offline currency-for-cash conversion, a legitimate large purchase, or an attempt to corner the market on a specific item, since a blanket large-volume-means-bad response would also catch legitimate high-spend players.
      - Build a player-to-player transaction network, with players as nodes and trades as weighted edges, rather than relying on per-transaction alerts alone, since graph-level patterns such as an isolated, dense cluster of repeated back-and-forth transfers between one player and many others, disconnected from the wider trading population, are a documented exploit signature that individual transaction thresholds miss.
      - Distinguish a genuine high-volume trader from a market manipulator or a bot-driven currency-selling operation by cross-referencing trade-network position and account behavior pattern, rather than by transaction size alone, since professional farming operations can otherwise look identical to a legitimate high-spend player in raw volume terms.
    evidence_requirements:
      - The exchange-rate trend for each currency pair over time, not just a single current rate.
      - The player-to-player transaction network for any flagged high-volume account, not just its aggregate trade volume.
    source_ids: [netease-inflation-monitoring-gdc2020]
