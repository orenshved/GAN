  - schema_version: 1
    item_id: generic-metadata-interfaces-let-tool-logic-work-across-rig-types
    title: Generic metadata interfaces let the same tool logic work across rig types and applications
    kind: professional_knowledge
    statement: Tools that depend on a generic interface to a rig's structure, rather than hardcoding one specific naming convention or metadata layout, can run the exact same underlying logic across rigs with completely different internal structures, different metadata systems, and even different authoring applications, with the cost of supporting a new structure isolated to writing one new interface implementation rather than modifying the tool itself.
