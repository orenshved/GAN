methods:
  - schema_version: 1
    method_id: shader-authoring-tiering-and-risk-review
    title: Shader authoring tiering and risk review
    purpose: Check that shader authorship, performance visibility, and preview accuracy are structured to prevent late-development performance surprises and cross-asset visual inconsistency, rather than leaving them to be discovered only once assets are already in the game.
    applicable_capability_ids: [technical_art]
    steps:
      - Check whether shader authorship is split by risk tier, most artists working from a curated library of specialized, purpose-built shaders rather than an open-ended general-purpose shader graph, with genuine custom shader creation reserved for a small, designated group of technical artists.
      - Check whether each library shader exposed to artists carries an explicit, plain-language relative performance indicator, rather than leaving artists to discover a shader's real cost only once it is profiled during a late optimization pass.
      - Check whether a shader's editor preview reflects the game's actual dynamic lighting, HDR, and moving-character conditions, rather than only a static preview setup, since materials that look consistent with each other in a static preview can diverge sharply once placed in real gameplay conditions.
      - Check whether shader parameters exposed to artists are named after their visual effect in plain language rather than raw technical or mathematical terms, since a parameter an artist cannot interpret tends to get tuned by trial and error, which is where cross-asset inconsistency actually originates.
    evidence_requirements:
      - Whether custom, non-library shader authorship is restricted to a small, designated group rather than open to any artist.
      - Whether a shader's performance cost is visible to the artist authoring it, before it reaches a late-development optimization pass.
    source_ids: [theodore-who-shall-build-this-shader-2009]
  - schema_version: 1
    method_id: plugin-based-tool-and-exporter-architecture-review
    title: Plugin-based tool and exporter architecture review
    purpose: Check that a pipeline tool handling multiple data types or content variants is structured to scale without becoming an unmaintainable monolith, and can absorb new requirements without forcing already-shipped content to break.
    applicable_capability_ids: [technical_art]
    steps:
      - Check whether a pipeline tool that handles multiple independent data types, such as an exporter handling geometry, skeletal data, and cloth, encapsulates each data type as an isolated, independently addable unit rather than accumulating all of them as intermixed logic inside one growing file, since the intermixed version becomes unreviewable and eventually gets discarded and rewritten from scratch rather than maintained.
      - Check whether adding support for a new data type or asset variant requires only adding a new self-contained unit in a known location, rather than editing shared logic that every other data type also depends on, since the ability to add functionality without touching working code is what actually lets a team experiment without fear of breaking something else.
      - Check whether a tool that must remain compatible with content already in production, such as rigs built years earlier, versions its building-block units so old content keeps building against the version it was authored with while new work uses the latest, rather than forcing a single shared version that either breaks old content or blocks all future iteration.
      - Check whether tools depend on a generic interface to project-specific structures, such as rig naming conventions or metadata layout, rather than hardcoding assumptions about one specific structure, since a generic interface lets the same tool logic work unmodified across multiple rig types, asset sources, or even different authoring applications.
    evidence_requirements:
      - Whether the tool's support for each data type or variant is isolated enough that changing one cannot silently affect another.
      - Whether older, already-shipped content is required to be manually migrated to a new tool version, or continues working against the version it was built with.
    source_ids: [malinowski-forward-facing-rigs-tools-pipelines-gdc2020]
