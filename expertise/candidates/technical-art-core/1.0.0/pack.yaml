  - schema_version: 1
    item_id: encapsulated-plugin-architecture-prevents-monolithic-tool-collapse
    title: Encapsulated plugin architecture prevents monolithic tool collapse
    kind: anti_pattern
    statement: A pipeline tool handling several independent data types tends to grow, through ordinary feature requests over a project's life, into one large intermixed file that no one fully understands or is willing to touch, and is eventually discarded and rewritten from scratch rather than maintained, encapsulating each data type as an isolated, independently addable unit from the start is a documented way to avoid reaching that point.
    domain_ids: [technical_art, game_technical_art]
    capability_ids: [technical_art]
    source_ids: [malinowski-forward-facing-rigs-tools-pipelines-gdc2020]
    method_ids: [plugin-based-tool-and-exporter-architecture-review]
    freshness_class: stable
    confidence: 0.86
  - schema_version: 1
    item_id: isolated-extensibility-lowers-the-cost-of-experimentation
    title: Isolated extensibility lowers the cost of experimentation
    kind: professional_knowledge
    statement: When adding support for a new data type or variant only requires dropping in a new self-contained unit rather than editing logic that every other data type also depends on, the actual cost of a failed experiment drops to removing one file, this lowered risk is what actually gives a technical art team the confidence to try new approaches rather than defaulting to the safest known solution.
    domain_ids: [technical_art, game_technical_art]
    capability_ids: [technical_art]
    source_ids: [malinowski-forward-facing-rigs-tools-pipelines-gdc2020]
    method_ids: [plugin-based-tool-and-exporter-architecture-review]
    freshness_class: stable
    confidence: 0.85
  - schema_version: 1
    item_id: versioning-pipeline-components-lets-old-content-keep-building
    title: Versioning pipeline components lets old content keep building while tools evolve
    kind: professional_knowledge
    statement: A tool that must remain compatible with content already in production should version its building-block units so that older content continues to build against the version it was originally authored with while new work uses the latest version, rather than forcing every piece of content onto one shared version, which either breaks stable, already-shipped content or blocks the team from ever iterating on the tool again.
    domain_ids: [technical_art, game_technical_art]
    capability_ids: [technical_art]
    source_ids: [malinowski-forward-facing-rigs-tools-pipelines-gdc2020]
    method_ids: [plugin-based-tool-and-exporter-architecture-review]
    freshness_class: stable
