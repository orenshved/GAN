    title: Tiered shader authorship reduces late-development risk
    kind: professional_knowledge
    statement: Splitting shader authorship by risk tier, most artists working from a curated library of purpose-built shaders while genuine custom shader creation stays with a small group of designated technical artists, reduces the risk of open-ended experimentation producing late-development performance surprises that have to be stripped out under deadline pressure.
