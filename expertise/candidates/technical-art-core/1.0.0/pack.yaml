  - schema_version: 1
    item_id: shader-performance-must-be-visible-at-authoring-time
    title: Shader performance must be visible at authoring time, not discovered later
    kind: anti_pattern
    statement: An artist given a general-purpose shader tool without visibility into relative cost will naturally experiment broadly, and the resulting performance problems tend to surface only late in development when they are most expensive and stressful to fix, exposing a shader's relative performance cost directly in the authoring tool, rather than leaving it to be discovered during a late optimization pass, is a documented way to avoid this.
    domain_ids: [technical_art, game_technical_art]
    capability_ids: [technical_art]
    source_ids: [theodore-who-shall-build-this-shader-2009]
    method_ids: [shader-authoring-tiering-and-risk-review]
    freshness_class: stable
    confidence: 0.85
  - schema_version: 1
    item_id: static-preview-can-hide-real-condition-visual-inconsistency
    title: A static preview can hide real-condition visual inconsistency
    kind: anti_pattern
    statement: Individually authored materials can look consistent with each other inside a static editor preview and still diverge sharply once placed under the game's actual dynamic lighting, HDR, or a moving character, without a preview that reflects real in-game conditions, visual inconsistency across a cast or environment can go completely undetected until it is already in the shipped game.
    domain_ids: [technical_art, game_technical_art]
    capability_ids: [technical_art]
    source_ids: [theodore-who-shall-build-this-shader-2009]
    method_ids: [shader-authoring-tiering-and-risk-review]
    freshness_class: stable
    confidence: 0.82
  - schema_version: 1
    item_id: plain-language-shader-parameters-prevent-trial-and-error-tuning
    title: Plain-language shader parameters prevent trial-and-error tuning
    kind: professional_knowledge
    statement: A shader parameter exposed to artists using raw technical or mathematical naming gets tuned by trial and error rather than genuine understanding of its visual effect, which is where cross-asset inconsistency actually originates, naming exposed parameters after their visual effect in plain language is a documented way to close this gap.
    domain_ids: [technical_art, game_technical_art]
    capability_ids: [technical_art]
    source_ids: [theodore-who-shall-build-this-shader-2009]
    method_ids: [shader-authoring-tiering-and-risk-review]
