methods:
  - schema_version: 1
    method_id: retention-data-confound-review
    title: Retention data confound review
    purpose: Check that a retention or engagement metric change is actually attributed to a game or design change, rather than an unexamined shift in audience mix, a masked subgroup effect, or a small-sample artifact.
    applicable_capability_ids: [funnel_analysis, analytics, ab_testing]
    steps:
      - Check whether a change in an aggregate metric could be explained by a shift in audience composition, such as a UA campaign, a viral spike, or a platform feature, rather than an actual change to the game; break the metric out by cohort, acquisition source, or tenure before attributing the change to a design decision.
      - Check whether an aggregate metric that looks healthy could be masking a serious problem in a smaller subgroup, such as a specific device or platform; break out by relevant segments rather than relying on the top-line average alone.
      - Before trusting a metric drawn from a small sample or narrow slice, check the sample size; a metric with too small a sample is not reliable evidence in either direction.
      - Confirm a claimed improvement is not cherry-picked, a single favorable data point remembered while surrounding unfavorable data is forgotten, and is not the product of confirmation bias from only looking for data that supports a specific theory.
    evidence_requirements:
      - The metric's breakdown by cohort, segment, or acquisition source, not only its aggregate value.
      - The sample size behind any claimed change or result.
    source_ids: [greer-data-driven-or-blinded-gdc2020]
  - schema_version: 1
    method_id: ab-test-design-and-interpretation-review
    title: A/B test design and interpretation review
    purpose: Check that an A/B test's assignment, duration, and evaluation criteria avoid documented, common ways tests produce misleading results.
    applicable_capability_ids: [ab_testing]
    steps:
      - Confirm test assignment happens at the point of actual exposure to the feature being tested, not at an earlier point such as app launch, which would dilute the test population with users who never encountered the tested feature.
      - Check the test's duration against known biases, an early cutoff over-weights the most engaged players who show up first, and a short window can catch only a short-term effect that reverses over a longer window.
      - Confirm the test's evaluation looks at more than the single primary KPI and considers downstream effects, since a change can improve its target metric while quietly harming another.
      - For metrics following a skewed, outlier-driven distribution such as revenue, check that the comparison uses medians or a test built for skewed distributions, not a mean-based comparison that a handful of high-spending outliers can dominate.
    evidence_requirements:
      - The point at which users were assigned to the test, and the test's actual run duration.
      - Which metrics, beyond the single primary one, were reviewed before declaring a result.
    source_ids: [greer-data-driven-or-blinded-gdc2020]
  - schema_version: 1
    method_id: onboarding-cognitive-load-review
    title: Onboarding cognitive load review
    purpose: Check that a new player's onboarding experience respects the brain's actual attention and working-memory limits, rather than assuming players will notice and absorb everything presented to them.
    applicable_capability_ids: [retention_design]
    steps:
      - Check whether the onboarding introduces more new mechanics, UI elements, or concepts at once than working memory can hold, roughly three items at a time, and whether unfamiliar mechanics are distributed over time rather than front-loaded.
      - Check whether an onboarding message or cue competes with an active, attention-demanding task; attention works like a spotlight on one task, not a broad scan, so a critical message shown while the player is engaged elsewhere is likely to go completely unperceived, not merely under-weighted.
      - Confirm a design's affordances, the visual or interactive cues suggesting what an element does, actually match its real functionality; a mismatched affordance actively misleads players and makes the correct behavior harder to teach afterward.
      - Confirm evidence for onboarding comprehension comes from actual observed behavior, such as playtest footage or attention data, rather than an assumption that a visible on-screen element was seen or understood.
    evidence_requirements:
      - The specific sequence and pacing of new concepts introduced during onboarding.
      - Any playtest or attention data supporting a claim that a specific onboarding element was actually noticed and understood.
    source_ids: [hodent-gamers-brain-onboarding-gdc2019]
