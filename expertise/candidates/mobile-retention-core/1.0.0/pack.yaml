  - schema_version: 1
    item_id: aggregate-averages-can-mask-subgroup-problems
    title: Aggregate averages can mask a real problem in a smaller subgroup
    kind: anti_pattern
    statement: A healthy-looking aggregate metric can mask a serious problem affecting a smaller subgroup, such as a specific device or platform; relying on top-line averages alone, without breaking a metric out by relevant segments, risks missing real, fixable issues entirely.
    domain_ids: [retention, game_retention]
    capability_ids: [analytics]
    source_ids: [greer-data-driven-or-blinded-gdc2020]
    method_ids: [retention-data-confound-review]
    freshness_class: stable
    confidence: 0.87
  - schema_version: 1
    item_id: small-sample-metrics-are-not-reliable-evidence
    title: Metrics from a small sample are not reliable evidence in either direction
    kind: professional_knowledge
    statement: A metric computed from a small enough sample size is not reliable evidence in either direction, since binary metrics like retention tolerate smaller samples much better than skewed, outlier-driven metrics like revenue; sample size should be checked and stated alongside any cohort or test result, not assumed adequate.
    domain_ids: [retention, game_retention]
    capability_ids: [analytics, ab_testing]
    source_ids: [greer-data-driven-or-blinded-gdc2020]
    method_ids: [retention-data-confound-review]
    freshness_class: stable
    confidence: 0.88
  - schema_version: 1
    item_id: cherry-picking-and-confirmation-bias-distort-metric-review
    title: Cherry-picking and confirmation bias distort metric review
    kind: anti_pattern
    statement: Reviewers naturally remember the one data point that hit a target and forget the surrounding data that did not, and tend to find confirming data when they go looking with a specific theory already in mind; a metric review should check the full run of data around a claimed result, not the single most favorable point.
    domain_ids: [retention, game_retention]
    capability_ids: [analytics]
    source_ids: [greer-data-driven-or-blinded-gdc2020]
    method_ids: [retention-data-confound-review]
    freshness_class: stable
    confidence: 0.85
  - schema_version: 1
    item_id: ab-test-assignment-must-match-actual-exposure
    title: A/B test assignment must match the point of actual exposure
    kind: professional_knowledge
    statement: An A/B test's population should be assigned at the point where users actually encounter the feature being tested, not at an earlier point such as app launch; assigning too early dilutes the test population with users who never interacted with the tested feature and biases the result.
    domain_ids: [retention, game_retention]
    capability_ids: [ab_testing]
    source_ids: [greer-data-driven-or-blinded-gdc2020]
    method_ids: [ab-test-design-and-interpretation-review]
    freshness_class: stable
    confidence: 0.87
  - schema_version: 1
    item_id: single-metric-ab-test-verdicts-miss-downstream-effects
    title: Judging an A/B test on a single metric alone can miss real downstream cost
    kind: anti_pattern
    statement: Judging an A/B test on a single target metric alone risks missing a real downstream cost; a documented case improved its primary conversion metric while quietly reducing overall revenue because the change removed options the most valuable players relied on, a tradeoff only visible by reviewing more than one metric together.
    domain_ids: [retention, game_retention]
    capability_ids: [ab_testing]
    source_ids: [greer-data-driven-or-blinded-gdc2020]
    method_ids: [ab-test-design-and-interpretation-review]
    freshness_class: stable
    confidence: 0.88
  - schema_version: 1
    item_id: onboarding-must-respect-working-memory-limits
    title: Onboarding must respect working memory's limited capacity
    kind: professional_knowledge
    statement: Working memory can hold only a few new items at once, roughly three; onboarding that introduces more new mechanics, controls, or concepts simultaneously than this exceeds what a new player can actually process, and unfamiliar mechanics should be distributed over time rather than front-loaded into the first few minutes.
    domain_ids: [retention, game_retention]
    capability_ids: [retention_design]
    source_ids: [hodent-gamers-brain-onboarding-gdc2019]
    method_ids: [onboarding-cognitive-load-review]
    freshness_class: stable
    confidence: 0.89
  - schema_version: 1
    item_id: onboarding-cues-competing-with-active-tasks-go-unnoticed
    title: Onboarding cues competing with an active task go unnoticed, not under-weighted
    kind: anti_pattern
    statement: Attention functions like a spotlight focused on one task at a time, not a broad scan of everything on screen; an onboarding message or cue shown while the player is actively engaged in a demanding task, such as combat, is likely to go completely unperceived rather than merely under-weighted, a failure mode directly observed in real playtest eye-tracking data.
    domain_ids: [retention, game_retention]
