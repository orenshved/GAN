    item_id: metric-changes-can-be-audience-mix-not-design
    title: A metric change can reflect audience mix, not an actual design change
    kind: professional_knowledge
    statement: A change in an aggregate engagement or revenue metric is often caused by a shift in who makes up the audience, such as a UA campaign, a viral spike, or a platform feature, rather than an actual change to the game; before attributing a metric change to a design decision, the metric should be broken out by cohort, acquisition source, or tenure to rule out an audience-mix explanation.
