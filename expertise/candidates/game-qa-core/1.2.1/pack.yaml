  - schema_version: 1
    item_id: qa-model-not-ground-truth
    title: Model opinion is heuristic
    kind: anti_pattern
    statement: A model may interpret independent evidence but cannot become the source of runtime, visual, accessibility, or fun evidence it did not observe.
    domain_ids: [qa]
    capability_ids: [ux_testing, visual_regression, accessibility_qa]
    source_ids: [gan-qa-policy]
    method_ids: [claim-evidence-matrix]
    freshness_class: stable
    confidence: 0.99
  - schema_version: 1
    item_id: qa-missing-is-visible
    title: Missing evidence stays visible
    kind: standard
    statement: Inconclusive or absent evidence blocks the affected claim unless the Director records an explicit scoped waiver.
    domain_ids: [qa, production]
    capability_ids: [functional_testing, automated_testing]
    source_ids: [gan-qa-policy]
    method_ids: [claim-evidence-matrix]
    freshness_class: stable
    confidence: 0.99
  - schema_version: 1
    item_id: qa-claims-bounded-by-scope
    title: Evaluation claims are bounded by their declared scope
    kind: professional_knowledge
    statement: Passing a claim for a sampled or partial evaluation does not extend the claim to unevaluated screens, states, or builds; a report must state exactly what was, and was not, evaluated.
    domain_ids: [qa]
    capability_ids: [functional_testing, visual_regression, accessibility_qa]
    source_ids: [wcag-em-2-0]
    method_ids: [wcag-em-scoped-evaluation, claim-evidence-matrix]
    freshness_class: version_sensitive
    confidence: 0.95
  - schema_version: 1
    item_id: qa-sampling-must-be-disclosed
    title: Sampling must be representative and disclosed
    kind: standard
    statement: When full coverage is infeasible, the evaluator must disclose how the sample was selected and why it represents the full scope; an undisclosed or convenience sample cannot support a general completion claim.
    domain_ids: [qa]
    capability_ids: [functional_testing, accessibility_qa, visual_regression]
    source_ids: [wcag-em-2-0]
    method_ids: [wcag-em-scoped-evaluation]
    freshness_class: version_sensitive
    confidence: 0.93
  - schema_version: 1
    item_id: qa-aggregate-verdict-hides-failures
    title: An aggregate pass/fail verdict hides per-item failures
    kind: anti_pattern
    statement: Reporting a single aggregate pass/fail across many sampled items obscures which specific items failed and why; a QA report needs per-item results so a failure is traceable to a concrete case, not averaged away.
    domain_ids: [qa]
    capability_ids: [functional_testing, automated_testing, visual_regression]
    source_ids: [wcag-em-2-0]
    method_ids: [wcag-em-scoped-evaluation]
    freshness_class: version_sensitive
    confidence: 0.92
  - schema_version: 1
    item_id: qa-golden-path-gets-highest-fidelity-test
    title: The primary successful path earns the most expensive test level
    kind: professional_knowledge
    statement: The most expensive, highest-fidelity automated test level should be reserved for a feature's primary successful path, since it protects the behavior most players actually exercise; edge and failure cases are better covered by a lighter-weight, more isolated test level, which keeps the overall suite fast enough to run continuously without losing meaningful coverage.
    domain_ids: [qa, game_qa]
    capability_ids: [automated_testing, functional_testing]
    source_ids: [masella-sot-automated-testing-gdc2019]
    method_ids: [test-level-fidelity-matching-review]
    freshness_class: stable
    confidence: 0.89
  - schema_version: 1
    item_id: qa-test-assertions-target-behavior-not-implementation
    title: A test should assert on the behavior, not an incidental implementation detail
    kind: anti_pattern
    statement: A test that asserts on an incidental implementation detail, such as an exact delay or frame count, rather than the feature's actual behavioral outcome will fail whenever that unrelated detail changes, even though the feature's real behavior is still correct; the assertion should wait or poll for the stated outcome instead.
    domain_ids: [qa]
    capability_ids: [automated_testing]
    source_ids: [masella-sot-automated-testing-gdc2019]
    method_ids: [test-level-fidelity-matching-review]
    freshness_class: stable
    confidence: 0.88
  - schema_version: 1
    item_id: qa-flaky-history-changes-how-a-failure-is-read
    title: A test's own reliability history changes how its failure should be read
    kind: professional_knowledge
    statement: A test with a documented history of intermittent failure should not be treated as confirming a regression on the strength of a single failure alone; that test's own reliability needs to be checked, and the result reproduced or investigated, before its failure is read as evidence that the change under review broke something.
    domain_ids: [qa]
    capability_ids: [automated_testing, functional_testing]
    source_ids: [masella-sot-automated-testing-gdc2019]
    method_ids: [test-suite-trust-governance-review]
    freshness_class: stable
    confidence: 0.87
  - schema_version: 1
    item_id: qa-unreliable-test-needs-fix-or-retire-deadline
    title: An unreliable test needs a bounded deadline to be fixed, or it should be retired
    kind: standard
    statement: A test that fails consistently without reflecting an actual feature defect should be quarantined so it stops blocking the team, with a bounded deadline given to its owner to fix it, and removed if it remains unfixed; a test left indefinitely in neither a trusted nor a retired state provides worse information than having no test at all.
    domain_ids: [qa, production]
    capability_ids: [automated_testing]
    source_ids: [masella-sot-automated-testing-gdc2019]
    method_ids: [test-suite-trust-governance-review]
    freshness_class: stable
    confidence: 0.86
  - schema_version: 1
    item_id: qa-visual-diff-needs-claim-specific-judgment
    title: A visual-diff failure shows a difference exists, not what it means
    kind: professional_knowledge
    statement: A screenshot or visual-comparison test failure establishes only that a pixel difference exists against a prior baseline; whether that difference is an actual visual defect or an intentional, accepted change still requires a specific judgment call, the same claim-specific scrutiny required of any other evidence class.
    domain_ids: [qa]
    capability_ids: [visual_regression]
    source_ids: [masella-sot-automated-testing-gdc2019]
    method_ids: [test-suite-trust-governance-review]
    freshness_class: stable
    confidence: 0.87
