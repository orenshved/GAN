# K4 Part C: cross-disciplinary boundary-recognition benchmark.
# state: draft — NOT installed, NOT reviewed, NOT trusted for routing.
# See docs/K4_LEAD_METHODOLOGY_ONTOLOGY_REVIEW.md and
# .ai/handoffs/claude-to-codex.md.
#
# Adds a benchmark testing whether qa-specialist recognizes when a report
# treats automated-test-passing (functional_testing/automated_testing —
# qa's real domain) as if it also confirmed a balance/economy-design claim
# (game-design-lead's or product-data's domain). No new source and no new
# item needed: this pack's existing "qa-claim-specific" ("A gate may pass
# only when its evidence class and producer can establish the exact claim
# under review") and "qa-model-not-ground-truth" items already state this
# discipline in general form; this benchmark is the first to test it against
# a specifically cross-disciplinary claim rather than a same-domain one.
# Sources, methods, and items are otherwise unchanged from 1.2.0.
schema_version: 1
pack_id: game-qa-core
name: Game QA Core
version: 1.2.1
supersedes_version: 1.2.0
description: >-
  Claim-specific evidence planning, independent verification, and honest
  completion gates, with a scoped-evaluation methodology (declared scope,
  disclosed sampling, per-item reporting) grounded in W3C's WCAG-EM; and
  test-fidelity matching and automated-suite trust governance, grounded in a
  shipped, live-service game's own automated-testing practice (Robert
  Masella, Rare — Sea of Thieves). This version adds benchmark coverage for
  a cross-disciplinary case of this pack's existing claim-specificity
  discipline: automated tests passing does not establish a balance or
  economy-design claim, which belongs to a different discipline's evidence.
