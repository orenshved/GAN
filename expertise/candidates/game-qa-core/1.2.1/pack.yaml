methods:
  - schema_version: 1
    method_id: claim-evidence-matrix
    title: Claim-to-evidence matrix
    purpose: Match each completion claim to evidence capable of proving it and an eligible evaluator.
    applicable_capability_ids:
      [
        functional_testing,
        automated_testing,
        ux_testing,
        visual_regression,
        accessibility_qa,
      ]
    steps:
      - State the exact technical, visual, subjective, or fun claim.
      - Select independent deterministic, measured, comparative, heuristic, or human evidence.
      - Record missing evidence, evaluator authority, and the resulting gate state.
    evidence_requirements:
      - Inspectable evidence with producer, origin, digest, time, and scope.
      - Human judgment for subjective acceptance.
    source_ids: [gan-qa-policy]
  - schema_version: 1
    method_id: wcag-em-scoped-evaluation
    title: Scoped evaluation with disclosed sampling
    purpose: Apply a structured scope-sample-evaluate-report methodology to any claim-based QA task, so a claim never silently extends beyond what was actually evaluated.
    applicable_capability_ids:
      [functional_testing, visual_regression, accessibility_qa]
    steps:
      - Define the evaluation scope precisely — exactly which screens, states, or builds the claim covers.
      - Where full coverage is not feasible, select and disclose a representative sample and the rationale for it, rather than testing an arbitrary or convenience subset.
      - Evaluate each sampled item against the specific claim and record a per-item result, not only an aggregate verdict.
      - Report which parts of the declared scope were not evaluated; the claim does not extend past what was actually evaluated.
    evidence_requirements:
      - The declared scope and, where sampling was used, the sample-selection rationale.
      - Per-item results alongside any aggregate summary.
    source_ids: [wcag-em-2-0]
  - schema_version: 1
    method_id: test-level-fidelity-matching-review
    title: Test-level fidelity matching review
    purpose: Match the cost and fidelity of an automated test to what it actually needs to verify — reserve the most expensive, full-context test level for a feature's primary successful path, cover edge and failure cases with a lighter-weight, more isolated test level, and check that a test asserts on the feature's real behavioral outcome rather than an incidental implementation detail.
    applicable_capability_ids: [automated_testing, functional_testing]
    steps:
      - Identify whether the specific behavior under test is the feature's primary successful path or an edge/failure case, and check that the most expensive test level is reserved for the former.
      - Check that a test's assertion targets the actual stated outcome (a condition waited or polled for, with a timeout) rather than an incidental implementation detail, such as an exact frame count or delay, that would break under an unrelated change.
      - When several related, low-risk behaviors share the same expensive setup, consider covering them within one test run rather than duplicating that setup per case; keep unrelated behaviors in separate tests.
      - Flag test coverage that is inverted — heavy investment on a minor edge case while the primary path has no coverage — as a targeting problem to fix before merging.
    evidence_requirements:
      - Which test level was used for the behavior under review, and whether it matches golden-path-versus-edge-case guidance.
      - Whether the test's assertion targets the behavioral outcome or an implementation detail.
    source_ids: [masella-sot-automated-testing-gdc2019]
  - schema_version: 1
    method_id: test-suite-trust-governance-review
    title: Automated test suite trust governance review
    purpose: Keep confidence in a large automated test suite by distinguishing a genuine regression from a test with a known history of unreliability, and by requiring a consistently unreliable test to be fixed or retired rather than left to erode trust in the whole suite indefinitely.
    applicable_capability_ids:
      [automated_testing, functional_testing, visual_regression]
    steps:
      - Before treating a single test failure as a confirmed regression, check whether that specific test has a documented history of intermittent failure unrelated to the change under review.
      - Require a test with a recurring intermittent-failure pattern to be tracked and assigned for investigation, rather than accepted indefinitely as routine noise.
      - Require a consistently unreliable test to be quarantined (stop letting it block the process) with a bounded deadline for its owner to fix it, and removed if it is not fixed by then.
      - Treat a visual-comparison or screenshot-diff failure as requiring the same claim-specific judgment as any other evidence, since a pixel difference against a prior baseline shows only that a difference exists, not whether it is a defect or an accepted change.
    evidence_requirements:
      - The specific test's own reliability history, checked before attributing its failure to the change under review.
      - Whether an unreliable test has an assigned owner, a quarantine status, and a deadline.
    source_ids: [masella-sot-automated-testing-gdc2019]
items:
  - schema_version: 1
    item_id: qa-claim-specific
    title: Evidence must fit the claim
    kind: professional_knowledge
    statement: A gate may pass only when its evidence class and producer can establish the exact claim under review.
    domain_ids: [qa]
