  - schema_version: 1
    item_id: steam-about-this-game-favors-skimmable-structure
    title: About This Game favors skimmable structure over a wall of text
    kind: standard
    statement: Valve's documentation for the About This Game section explicitly recommends short paragraphs, bolded key features or headers, and visual aids over one dense unbroken block of text, on the stated basis that shorter, skimmable content converts a distracted storefront visitor more effectively than a wall of text.
    domain_ids: [marketing, game_marketing]
    capability_ids: [store_copy, marketing_assets]
