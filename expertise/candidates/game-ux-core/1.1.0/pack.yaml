methods:
  - schema_version: 1
    method_id: ux-task-flow-review
    title: Task-flow review
    purpose: Trace a player goal through visible states, controls, feedback, recovery, and completion.
    applicable_capability_ids:
      [usability_analysis, interaction_design, onboarding_ux]
    steps:
      - Name the player goal and starting state.
      - Trace each action, response, error path, and completion signal.
      - Separate observed behavior from intended behavior and recommendations.
    evidence_requirements:
      - Inspectable project UI structure or runtime capture.
      - Explicit uncertainty where runtime behavior has not been observed.
    source_ids: [gan-ux-evidence-policy]
  - schema_version: 1
    method_id: accessible-navigation-review
    title: Accessible navigation review
    purpose: Check whether focus, labels, contrast, input alternatives, and recovery support the target player context.
    applicable_capability_ids: [accessibility_ux, controller_navigation]
    steps:
      - Identify supported input methods and navigation order.
      - Inspect focus visibility, labels, contrast, and error recovery.
      - Request measured or human evidence for player-facing claims.
    evidence_requirements:
      - Target input methods and platform constraints.
      - Runtime or human evidence before claiming usability.
    source_ids: [wcag-2-2, gan-ux-evidence-policy]
  - schema_version: 1
    method_id: game-accessibility-scoping-review
    title: Game accessibility scoping review
    purpose: Determine which accessibility guideline areas actually apply to a game's specific mechanics before claiming coverage, instead of treating accessibility as one pass/fail checkbox.
    applicable_capability_ids:
      [accessibility_ux, controller_navigation, onboarding_ux]
    steps:
      - List the game's core input methods, feedback channels (visual, audio, haptic), and any mechanics that rely on color, timing, or precision.
      - For each guideline area (input remapping, subtitles/captions, colorblind-safe signaling, difficulty/assist options, clear tutorial instructions), determine whether the game contains the elements that area targets.
      - Only mark a guideline area addressed when the specific mechanic it targets was inspected or tested; mark areas that do not apply as out of scope, not as passed.
      - Record any guideline area whose target mechanic exists but was not inspected as untested, not as covered.
    evidence_requirements:
      - The list of input methods and mechanics the review actually inspected.
      - Runtime or human evidence for each claimed guideline area; a settings-menu entry by itself is not sufficient.
    source_ids: [xbox-accessibility-guidelines]
items:
  - schema_version: 1
    item_id: ux-observed-vs-intended
    title: Separate observed and intended behavior
    kind: professional_knowledge
    statement: Treat inspectable controls as evidence of current structure, not proof of intended flow or player comprehension.
    domain_ids: [ux, game_ui]
    capability_ids: [usability_analysis, onboarding_ux]
    source_ids: [gan-ux-evidence-policy]
    method_ids: [ux-task-flow-review]
    freshness_class: stable
    confidence: 0.98
  - schema_version: 1
    item_id: ux-input-paths
    title: Validate every declared input path
    kind: standard
    statement: Navigation recommendations must account for each declared priority input method and preserve visible focus and recovery.
    domain_ids: [ux, accessibility]
    capability_ids: [controller_navigation, accessibility_ux]
    source_ids: [wcag-2-2]
    method_ids: [accessible-navigation-review]
    freshness_class: version_sensitive
    confidence: 0.95
  - schema_version: 1
    item_id: ux-no-visual-proof
    title: A screenshot is not usability proof
    kind: anti_pattern
    statement: Static appearance alone cannot establish task completion, navigation correctness, accessibility, or player understanding.
    domain_ids: [ux, game_ui]
    capability_ids: [usability_analysis, accessibility_ux]
    source_ids: [gan-ux-evidence-policy]
    method_ids: [ux-task-flow-review, accessible-navigation-review]
    freshness_class: stable
    confidence: 0.99
  - schema_version: 1
    item_id: ux-accessibility-is-mechanic-scoped
    title: Accessibility coverage is scoped per mechanic, not a single checkbox
    kind: professional_knowledge
    statement: Whether a guideline area (remapping, captions, colorblind-safe signaling, assist options, clear instructions) applies depends on the game's specific mechanics; claiming general "accessibility support" without scoping to the mechanics present overstates coverage.
    domain_ids: [ux, accessibility, game_ui]
    capability_ids: [accessibility_ux, onboarding_ux]
    source_ids: [xbox-accessibility-guidelines]
    method_ids: [game-accessibility-scoping-review, ux-task-flow-review]
    freshness_class: version_sensitive
    confidence: 0.93
  - schema_version: 1
    item_id: ux-remapping-needs-verification
    title: Input remapping must be verified, not assumed from a menu entry
    kind: standard
    statement: A remap-controls menu entry is not evidence that every action is remappable, conflict-free, and usable with the player's declared input method; each remapped action needs functional verification.
    domain_ids: [ux, accessibility, controller_navigation]
    capability_ids: [controller_navigation, accessibility_ux]
    source_ids: [xbox-accessibility-guidelines]
    method_ids: [game-accessibility-scoping-review]
    freshness_class: version_sensitive
    confidence: 0.92
  - schema_version: 1
    item_id: ux-tutorial-clarity-is-testable
    title: Tutorial and instruction clarity is a testable onboarding property
    kind: professional_knowledge
    statement: Instruction clarity is a specific, evaluable onboarding property (wording, pacing, redundant non-color cues, and confirmation of player understanding), not a byproduct of a tutorial screen existing.
    domain_ids: [ux, accessibility, onboarding]
    capability_ids: [onboarding_ux, accessibility_ux]
    source_ids: [xbox-accessibility-guidelines]
    method_ids: [game-accessibility-scoping-review, ux-task-flow-review]
    freshness_class: version_sensitive
    confidence: 0.9
