schema_version: 1
pack_id: game-design-core
name: Game Design Core
version: 1.0.0
description: >-
  Mechanics-to-dynamics-to-aesthetics decomposition and evidence-scoped
  balance change practice, grounded in the MDA framework (Hunicke, LeBlanc,
  Zubek, 2004). `onboarding_design` is the thinnest capability here — MDA
  addresses design generally, not onboarding specifically; a dedicated
  onboarding/tutorial-design source is a candidate for a future version.
state: draft
