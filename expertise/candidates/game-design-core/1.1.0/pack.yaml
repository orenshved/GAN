# Retrospective sourcing upgrade (K-retrospective, upgrade #3 of 4). state: draft
# — NOT installed, NOT reviewed, NOT trusted for routing.
# See docs/RETROSPECTIVE_SOURCING_AUDIT.md and .ai/handoffs/claude-to-codex.md.
#
# 1.0.0's primary source (the MDA framework paper) is abstract academic theory,
# not a practitioner's account of balancing a specific shipped game at scale. The
# audit's own rationale: "MDA is worth keeping as a citation, but pairing it with
# a shipped-title design account would substantiate mechanics_design/balance_design
# more concretely." MDA is RETAINED here (it is still correct and still the right
# citation for the mechanics-dynamics-aesthetics decomposition itself); the new
# source adds concrete, live-service-scale balance practice that MDA's own
# abstraction cannot provide: how to target a balance change at a specific skill
# population instead of an assumed universal "correct" tuning, how to avoid
# over-trusting an aggregate win-rate number, and how to recognize when repeated
# tuning on the same target signals a systemic cause rather than another isolated
# fix. `onboarding_design` remains this pack's thinnest capability, unaffected by
# this upgrade and still a candidate for a dedicated source in a future version.
