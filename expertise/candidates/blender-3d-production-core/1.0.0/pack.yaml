methods:
  - schema_version: 1
    method_id: blender-nondestructive-asset-workflow-review
    title: Blender non-destructive asset workflow review
    purpose: Check that a 3D asset production workflow in Blender actually gets the tool's key production advantages, non-destructive editing, custom data for cross-tool interop, and real-time preview validation, rather than working as if it were a purely destructive, offline-render tool.
    applicable_capability_ids: [character_art, environment_art, prop_art]
    steps:
      - Check whether geometry-shaping operations are being applied as reversible modifiers rather than committed directly to the base mesh, since a non-destructive, modifier-based workflow keeps every step editable later, which matters heavily in game production where asset requirements change repeatedly during development.
      - Check whether production metadata needed downstream, such as vertex groups, bevel weights, or custom object properties, is being stored directly on the mesh data and carried through an interchange format that preserves custom attributes, rather than being reconstructed by hand at each pipeline stage.
      - Check whether shading and texturing are being evaluated in a real-time viewport before the asset is exported and imported into the game engine, since catching a shading problem in the authoring tool is far cheaper than discovering it only after a full export-import round trip.
      - For asset types with a documented Blender-specific technique, such as hair-card grooming for real-time hair, check whether that established technique is being used rather than a slower or less game-appropriate approach carried over from offline-render workflows.
    evidence_requirements:
      - Whether the asset's construction history uses non-destructive modifiers or destructive edits committed directly to the base mesh.
      - Whether production metadata needed downstream survives the export and import round trip into the next pipeline stage or tool.
    source_ids: [embark-blender-game-dev-pipeline-2020]
  - schema_version: 1
    method_id: shared-topology-and-rig-system-review
    title: Shared topology and rig system review
    purpose: Check that a character or prop production system scales to a large cast or a large set of variants without linearly scaling cost, using shared topology, shared rigs, and modular attachments rather than fully bespoke assets per character.
    applicable_capability_ids: [character_art, prop_art, rigging]
    steps:
      - Check whether a family of similar characters is built from a shared base topology, UV layout, and facial rig rather than each being modeled, unwrapped, and rigged independently, since a shared foundation lets new heads be rigged in effectively one step and lets textures and model elements be reused across the cast.
      - Check whether background or crowd characters have their own dedicated, purpose-built low-cost version, with reduced vertex count, textures baked down to fewer materials, and a simplified rig, rather than simply being scaled-down instances of a full hero asset, since many hero-cost instances on screen at once becomes a real performance problem.
      - Check whether tiered or variant equipment is built as separate attachment pieces layered over one shared base body rather than as several complete unique body assets, since this keeps the major cost on the single shared base while variation is added cheaply through the attachments.
      - Check whether a reference or override system that swaps a real asset in at runtime uses a near-zero-cost placeholder as its default, rather than a real, full-cost asset, since a real default can be loaded into memory alongside the actual override at the same time, silently doubling the cost, and a placeholder also makes a missing override immediately visible rather than silently expensive.
    evidence_requirements:
      - Whether characters sharing a role or tier share base topology, UVs, and rig, or are each built independently.
      - What the default or placeholder asset is in any runtime reference or override system, and its actual cost if never replaced.
    source_ids: [goulden-bioshock-infinite-iteration-gdc2014]
  - schema_version: 1
    method_id: asset-iteration-and-readability-discipline-review
    title: Asset iteration and readability discipline review
    purpose: Check that an asset or character design decision is judged by whether it actually reads and fits in its real production context, rather than by the polish or prior investment already put into it.
    applicable_capability_ids: [character_art, environment_art]
    steps:
      - Check whether a design's intended meaning, such as a character's personality, role, or narrative signal, has actually been verified to read correctly once placed in real game context, rather than assumed to work because it looked correct in isolated concept art or an early build.
      - When new information changes what an asset actually needs to do, such as a narrative or scope change altering how much a character appears, check that the asset is judged against its new requirements rather than kept because of how much time was already invested in it.
      - Check whether a claimed problem with an asset is actually a readability or context problem rather than an execution-quality problem, since a well-executed asset can still fail if it does not communicate what it needs to in the actual game, and the fix for each is different.
      - Confirm that a decision to discard or substantially rework an asset is driven by an identified functional or narrative gap, not treated as a personal or team failure, since discarding validated-but-now-wrong work is a normal, expected part of iterative production.
    evidence_requirements:
      - Whether the design's intended read has been checked in actual game context, not just in isolated concept or early-build review.
      - What specific requirement changed to prompt reconsidering an already-built asset, if a rework or discard is being proposed.
    source_ids: [goulden-bioshock-infinite-iteration-gdc2014]
  - schema_version: 1
    method_id: rig-architecture-and-additive-animation-review
    title: Rig architecture and additive animation review
    purpose: Check that a rig's attachment architecture and a first-person animation's pose and camera systems are built to avoid known, documented failure patterns rather than the most obvious naive implementation.
    applicable_capability_ids: [animation, rigging]
    steps:
      - Check where a weapon or held-prop attachment bone sits in the rig hierarchy, an attachment bone placed deep in the arm chain, below the hand, can produce a visible desync artifact during in-engine playback as it interpolates back toward its parent's position between keyframes, a dedicated weapon-attachment bone parented under the rig's root avoids this.
      - Check whether the field of view used to render the game world is decoupled from the field of view used to render a first-person view-model, since without that separation, a player's own FOV preference directly stretches and distorts hand and weapon poses an animator specifically authored.
      - Check whether first-person animation is structured as a base pose with separate additive layers for aim, movement, and per-weapon accents, rather than as one monolithic clip per action, since a layered structure lets a base pose change propagate automatically through every action built on top of it.
      - Check whether secondary motion systems, such as spring-based lag and lean, are tuned with different parameters per character rather than applied uniformly across a cast, since the same underlying system can be tuned to read as completely different personalities purely through parameter changes.
    evidence_requirements:
      - Where the weapon or prop attachment bone sits in the rig hierarchy relative to the hand chain and the root.
      - Whether world FOV and first-person view-model FOV are driven by the same setting or are decoupled.
    source_ids: [boehm-overwatch-first-person-animation-gdc2017]
