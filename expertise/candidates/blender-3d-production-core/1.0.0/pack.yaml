  - schema_version: 1
    item_id: crowd-variants-need-a-dedicated-reduced-budget-not-a-scaled-down-hero-asset
    title: Crowd variants need a dedicated reduced budget, not a scaled-down hero asset
    kind: professional_knowledge
    statement: A background or crowd character needs its own dedicated, purpose-built low-cost version, with reduced vertex count, textures baked down to fewer materials, and a heavily simplified rig, rather than simply being a scaled-down instance of the full hero asset, since a crowd rendered at hero-asset cost becomes a real performance problem once many instances appear on screen at once.
    domain_ids: [blender, game_3d_production]
    capability_ids: [character_art, environment_art]
    source_ids: [goulden-bioshock-infinite-iteration-gdc2014]
    method_ids: [shared-topology-and-rig-system-review]
    freshness_class: stable
    confidence: 0.85
  - schema_version: 1
    item_id: modular-attachment-system-shares-cost-across-prop-variants
    title: A modular attachment system shares cost across prop variants
    kind: professional_knowledge
    statement: Building tiered or variant equipment as separate attachment pieces layered over one shared base body, rather than as several complete unique body assets, keeps the major memory and production cost on the single shared base while variation is added cheaply through the attachments, and lets kit-bashed combinations be reused across many characters.
    domain_ids: [blender, game_3d_production]
    capability_ids: [prop_art, character_art]
    source_ids: [goulden-bioshock-infinite-iteration-gdc2014]
    method_ids: [shared-topology-and-rig-system-review]
    freshness_class: stable
    confidence: 0.85
  - schema_version: 1
    item_id: naive-asset-reference-systems-can-silently-double-memory-cost
    title: A naive asset reference system can silently double memory cost
    kind: anti_pattern
    statement: A reference or override system that swaps one asset in for a default at runtime can load both the default and the actual override into memory at the same time if the default itself is a real, full-cost asset, a documented fix is to make the default a near-zero-cost placeholder so only the intended asset is ever actually paid for, and a missing override becomes immediately and visibly obvious rather than silently expensive.
    domain_ids: [blender, game_3d_production]
    capability_ids: [character_art, prop_art]
    source_ids: [goulden-bioshock-infinite-iteration-gdc2014]
    method_ids: [shared-topology-and-rig-system-review]
    freshness_class: stable
    confidence: 0.83
  - schema_version: 1
    item_id: a-design-can-fail-purely-on-readability-regardless-of-execution-quality
    title: A design can fail purely on readability, regardless of execution quality
    kind: anti_pattern
    statement: A character or asset design can be well executed and still fail because its intended meaning does not actually read in context, a documented example is an early character design intended to convey innocence and mystery through subtle wardrobe and hair choices that tested as generic and forgettable once placed in the actual game rather than communicating any of what was intended, readability in real context is a separate test from the quality of the asset in isolation.
    domain_ids: [blender, game_3d_production]
    capability_ids: [character_art, environment_art]
    source_ids: [goulden-bioshock-infinite-iteration-gdc2014]
    method_ids: [asset-iteration-and-readability-discipline-review]
    freshness_class: stable
    confidence: 0.87
  - schema_version: 1
    item_id: sunk-cost-in-a-polished-asset-is-not-a-reason-to-keep-it
    title: Sunk cost in a polished asset is not a reason to keep it
    kind: professional_knowledge
    statement: A deeply polished, heavily invested asset should still be discarded or reworked when new information, such as a narrative pacing change shifting how much a character actually appears, shows it no longer serves its purpose, treating months of prior work as a sunk cost rather than a reason to keep a wrong asset is a documented, repeatable production discipline, not a one-time exception.
    domain_ids: [blender, game_3d_production]
    capability_ids: [character_art]
    source_ids: [goulden-bioshock-infinite-iteration-gdc2014]
    method_ids: [asset-iteration-and-readability-discipline-review]
    freshness_class: stable
    confidence: 0.88
  - schema_version: 1
    item_id: weapon-attachment-point-placement-can-cause-visible-in-engine-desync
    title: Weapon attachment point placement in the rig can cause visible in-engine desync
    kind: anti_pattern
    statement: Attaching a weapon bone deep in the arm's bone chain, below the hand, can produce a visible desync artifact during animation playback in engine, because the attachment bone interpolates back toward its parent's position between keyframes at runtime, a documented fix is a dedicated weapon-attachment bone parented under the rig's root rather than under the hand, keeping the weapon's motion independent of exactly how the hand chain is posed.
    domain_ids: [blender, game_3d_production]
    capability_ids: [rigging]
    source_ids: [boehm-overwatch-first-person-animation-gdc2017]
    method_ids: [rig-architecture-and-additive-animation-review]
    freshness_class: stable
    confidence: 0.86
  - schema_version: 1
    item_id: separating-world-fov-from-view-model-fov-protects-authored-hand-poses
    title: Separating world FOV from view-model FOV protects authored hand poses
    kind: professional_knowledge
    statement: Decoupling the field of view used to render the game world from the field of view used to render a first-person view-model lets players adjust their own world FOV preference without distorting or stretching the hand and weapon poses an animator specifically authored, without this separation a player's FOV setting directly warps every carefully crafted first-person pose.
    domain_ids: [blender, game_3d_production]
    capability_ids: [animation, rigging]
    source_ids: [boehm-overwatch-first-person-animation-gdc2017]
    method_ids: [rig-architecture-and-additive-animation-review]
    freshness_class: stable
    confidence: 0.85
  - schema_version: 1
    item_id: layered-additive-poses-let-a-base-pose-change-cascade-without-reauthoring
    title: Layered additive poses let a base pose change cascade without reauthoring
    kind: professional_knowledge
    statement: Structuring first-person animation as a base pose with separate additive layers for aim, movement, and per-weapon accents, rather than authoring every action as one monolithic clip, lets a change to the base pose propagate automatically through every layered action built on top of it instead of requiring each action to be manually re-authored.
    domain_ids: [blender, game_3d_production]
    capability_ids: [animation]
    source_ids: [boehm-overwatch-first-person-animation-gdc2017]
    method_ids: [rig-architecture-and-additive-animation-review]
    freshness_class: stable
