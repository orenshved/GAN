    item_id: nondestructive-modifier-workflow-enables-safe-iteration
    title: A non-destructive modifier workflow enables safe iteration
    kind: professional_knowledge
    statement: Building game assets with non-destructive modifiers rather than committing directly to base geometry keeps every step editable and re-orderable later, this matters heavily in game production where asset requirements change repeatedly during development and a destructive edit forecloses easy revision.
    domain_ids: [blender, game_3d_production]
