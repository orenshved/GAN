  - schema_version: 1
    item_id: shared-base-topology-and-rig-speeds-production-and-consistency
    title: A shared base topology and rig speeds production and consistency
    kind: professional_knowledge
    statement: Deriving a family of characters from a shared base topology, UV layout, and facial rig lets new heads be rigged in effectively one step and lets textures and model elements be reused across characters, trading a small amount of creative freedom per character for large gains in production speed and visual consistency across a large cast.
    domain_ids: [blender, game_3d_production]
    capability_ids: [character_art, rigging]
    source_ids: [goulden-bioshock-infinite-iteration-gdc2014]
