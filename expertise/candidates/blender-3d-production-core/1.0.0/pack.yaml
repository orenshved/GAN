  - schema_version: 1
    item_id: custom-mesh-attribute-data-enables-cross-tool-interop
    title: Custom mesh attribute data enables cross-tool interop
    kind: professional_knowledge
    statement: Storing production metadata such as vertex groups, bevel weights, or custom per-object properties directly on the mesh data, then carrying it through an interchange format that preserves custom attributes, lets information created in one tool survive a handoff to another tool or engine in the pipeline rather than being lost or needing to be manually rebuilt at each stage.
    domain_ids: [blender, game_3d_production]
    capability_ids: [character_art, environment_art, prop_art]
