methods:
  - schema_version: 1
    method_id: art-consistency-review
    title: Art consistency review
    purpose: Check whether an asset or concept applies a consistent set of compositional principles — balance, contrast, hierarchy, unity — rather than making ad hoc visual choices unrelated to the rest of its set.
    applicable_capability_ids:
      [art_direction, visual_development, concept_art, ui_art]
    steps:
      - Identify the intended focal point and hierarchy for the piece or screen, and check whether contrast and placement actually direct the eye there.
      - Compare the asset against others in the same set for consistent use of balance, proportion, and rhythm — not identical, but recognizably part of the same visual language.
      - Distinguish a deliberate departure from the established language (a boss, a rare item) from an inconsistency that reads as an error.
      - Note any principle violated with no apparent reason, and ask whether it was a deliberate choice or an oversight.
    evidence_requirements:
      - The specific asset(s) under review and the set they are meant to belong to.
      - The stated, or explicitly inferred and flagged as inferred, intended focal point and hierarchy for the piece.
    source_ids: [graphic-design-fundamentals-jeffery]
  - schema_version: 1
    method_id: art-pipeline-tracking-review
    title: Art pipeline tracking review
    purpose: Track art assets through explicit pipeline stages with a stated exit criterion per stage, instead of an informal "done when it looks done" status.
    applicable_capability_ids: [asset_tracking, art_direction]
    steps:
      - Define the pipeline stages an asset passes through (for example concept, blockout, first pass, final, integrated) and what must be true to call each stage complete.
      - Record which stage each asset is actually in, not just whether "art is being worked on" in general.
      - Surface assets stuck at a stage well past their expected duration as a visible risk, the same way a production impediment is tracked.
      - Distinguish an asset that is blocked on a dependency from one that is simply still in progress.
    evidence_requirements:
      - The current stage of each asset under review and its Definition of Done for that stage.
      - How long the asset has been in its current stage.
    source_ids: [scrum-guide-2020]
  - schema_version: 1
    method_id: visual-stereotype-discrimination-review
    title: Visual stereotype versus cliche discrimination review
    purpose: Judge whether a recognizable, familiar visual element (a "visual stereotype") is functioning as a deliberate tool that supports the project's own established visual design rule set, or has become an inert cliche reused out of habit with no project-specific rationale.
    applicable_capability_ids: [art_direction, visual_development]
    steps:
      - Identify the visual design rule set already established for this project (the specific visual language, palette, and design logic this game has built, not genre convention in general).
      - Ask whether the recognizable element under review supports and strengthens that specific rule set, or was substituted from generic/stock reference unrelated to it.
      - If the element is meant to accelerate audience orientation (a familiar setting cue, archetype, or genre marker), confirm that intent is stated, not assumed after the fact.
      - Treat "it reads as expected" or "it's recognizable" as insufficient justification on its own; recognizability and rule-set support are separate questions.
    evidence_requirements:
      - The project's own established visual design rule set or reference language for the relevant asset category.
      - The specific element under review and whether its use was a deliberate choice against that rule set or an unreflective default.
    source_ids: [macdonald-visual-threshold]
  - schema_version: 1
    method_id: visual-rule-set-integrity-review
    title: Cross-medium visual identity integrity review
    purpose: Check whether a proposed or shipped element reinforces the same visual identity system as every other channel it should share with (palette, materials, architecture, props, signage, branding), rather than approving it on its own, isolated merits.
    applicable_capability_ids: [art_direction, visual_development, ui_art]
    steps:
      - Identify every channel the relevant identity system should appear through for this world or faction (for example palette, material language, architecture, props, signage, logo/branding).
      - Compare the specific element under review against each of those channels, not only against itself or a single reference image.
      - If the element diverges from the established system, determine whether that divergence is a deliberate, documented exception (a distinct faction, an intentionally foreign structure) or an unreviewed drift.
      - Distinguish a genuinely new baseline addition that has no established convention yet (which can proceed on known genre or world-logic defaults) from a change that contradicts an already-established one (which needs the rule-set check above).
    evidence_requirements:
      - The established visual identity system across its relevant channels for this world or faction.
      - The specific element under review, compared channel-by-channel, not evaluated in isolation.
    source_ids: [macdonald-visual-threshold]
  - schema_version: 1
    method_id: art-claim-boundary-review
    title: Art claim boundary review
    purpose: Check that a status update's claim about visual work is scoped to what visual evidence can actually establish, and does not silently extend into a gameplay-feel or balance claim that belongs to game design's own evidence.
    applicable_capability_ids: [art_direction, visual_development]
    steps:
      - Identify the specific visual claim art's own evidence can establish (does the asset match the established visual language, is a telegraph or readability element clear and consistent with the rule set).
      - Identify any gameplay-feel, difficulty, or balance claim bundled alongside the visual claim, and check whether it is being asserted on the strength of the visual work alone.
      - Confirm the gameplay-feel or balance claim is backed by game design's own evidence (playtest data, balance review) rather than treated as settled because the associated visual work landed.
      - Scope the art review's own conclusion strictly to the visual claim, and flag the unconfirmed gameplay-feel claim as needing game design's evidence separately.
    evidence_requirements:
      - The specific visual claim under review and the established visual rule set it is checked against.
      - Whether any bundled gameplay-feel or balance claim has its own game-design evidence, or is only inferred from the visual work.
    source_ids: [macdonald-visual-threshold]
items:
  - schema_version: 1
    item_id: art-hierarchy-before-contrast
    title: Hierarchy directs attention before contrast confirms it
    kind: professional_knowledge
    statement: A piece establishes visual hierarchy by ordering elements by importance; contrast in value, color, or scale is the tool that makes that ordering readable at a glance, not a substitute for having an ordering in the first place.
    domain_ids: [art, game_art]
    capability_ids: [visual_development, concept_art]
    source_ids: [graphic-design-fundamentals-jeffery]
    method_ids: [art-consistency-review]
    freshness_class: stable
    confidence: 0.88
  - schema_version: 1
    item_id: art-consistency-judged-across-set
    title: Consistency is judged across the set, not within a single piece
    kind: standard
    statement: Whether a color palette, silhouette language, or level of detail is consistent can only be judged by comparing an asset against the rest of its set; a single piece cannot be consistent or inconsistent in isolation.
    domain_ids: [art, game_art]
    capability_ids: [art_direction, visual_development]
    source_ids: [graphic-design-fundamentals-jeffery]
    method_ids: [art-consistency-review]
    freshness_class: stable
    confidence: 0.9
  - schema_version: 1
    item_id: art-polish-not-same-as-brief
    title: Looking finished is not the same as meeting the brief
    kind: anti_pattern
    statement: A polished-looking asset can still fail its intended hierarchy, readability, or consistency requirements; visual polish and correctness against the art direction's actual requirements are separate questions, and finishing one does not confirm the other.
    domain_ids: [art, game_art]
    capability_ids: [concept_art, ui_art, art_direction]
    source_ids: [graphic-design-fundamentals-jeffery]
    method_ids: [art-consistency-review]
    freshness_class: stable
    confidence: 0.91
  - schema_version: 1
    item_id: art-pipeline-stage-needs-exit-criterion
    title: Asset pipeline stages need an explicit exit criterion
    kind: professional_knowledge
    statement: An asset's pipeline status is only useful if each stage has an explicit, shared completion criterion; without one, two people can disagree about whether an asset is actually ready to move to the next stage.
    domain_ids: [art, production]
    capability_ids: [asset_tracking]
    source_ids: [scrum-guide-2020]
    method_ids: [art-pipeline-tracking-review]
    freshness_class: slow_changing
    confidence: 0.9
  - schema_version: 1
    item_id: art-stalled-asset-is-visible-risk
    title: A stalled asset is a visible risk, not silent progress
    kind: standard
    statement: An asset that has stayed in one pipeline stage well past its expected duration should be surfaced the same way a production impediment is, with an owner and a re-inspection point, rather than left to appear as ordinary in-progress work.
    domain_ids: [art, production]
    capability_ids: [asset_tracking, art_direction]
    source_ids: [scrum-guide-2020]
    method_ids: [art-pipeline-tracking-review]
    freshness_class: slow_changing
    confidence: 0.87
  - schema_version: 1
    item_id: functional-trope-vs-cliche-test
    title: A visual stereotype is functional only while it still serves the project's own rule set
    kind: professional_knowledge
    statement: A recognizable visual element earns its place as a useful visual stereotype when it actively supports the project's own established visual design rule set; the same element becomes a cliche once it is retained out of habit or genre convention rather than because it still serves that specific rule set — the test is whether it supports the rule set, not whether it is familiar.
    domain_ids: [art, game_art]
    capability_ids: [art_direction]
    source_ids: [macdonald-visual-threshold]
    method_ids: [visual-stereotype-discrimination-review]
    freshness_class: stable
    confidence: 0.87
  - schema_version: 1
    item_id: familiar-elements-accelerate-orientation
    title: A deliberately familiar visual element buys attention for the genuinely new ones
    kind: professional_knowledge
    statement: Deliberately reusing a familiar, recognizable visual element lets an audience orient to a game's setting quickly, freeing the audience's limited attention and the production's own time for the setting's genuinely new or unique elements, rather than spending both on establishing baseline expectations from scratch.
    domain_ids: [art, game_art]
    capability_ids: [art_direction, visual_development]
    source_ids: [macdonald-visual-threshold]
    method_ids: [visual-stereotype-discrimination-review]
    freshness_class: stable
    confidence: 0.85
  - schema_version: 1
    item_id: visual-identity-must-hold-across-mediums
    title: A visual identity is only consistent if every channel it appears through reinforces it
    kind: standard
    statement: A world's or faction's visual identity — palette, materials, architecture, signage, props, and branding — is only actually consistent if each of those channels reinforces the same identity system; checking a single asset in isolation cannot confirm this, the check has to span every channel the identity is meant to appear through.
    domain_ids: [art, game_art]
    capability_ids: [art_direction, visual_development, ui_art]
    source_ids: [macdonald-visual-threshold]
    method_ids: [visual-rule-set-integrity-review]
    freshness_class: stable
    confidence: 0.88
  - schema_version: 1
    item_id: new-additions-checked-against-rule-set-not-taste
    title: New art additions are checked against the established rule set, not the reviewer's taste
    kind: anti_pattern
    statement: Approving or rejecting a new art addition based on the reviewer's personal taste, rather than against the project's already-established visual design rule set, is a common failure mode; additions that arrive late in production are especially at risk and should be explicitly checked for whether they reinforce or dilute the existing system, with any genuine exception made deliberately and documented rather than silently allowed to drift.
    domain_ids: [art, game_art]
    capability_ids: [art_direction]
    source_ids: [macdonald-visual-threshold]
    method_ids: [visual-rule-set-integrity-review]
    freshness_class: stable
    confidence: 0.86
  - schema_version: 1
    item_id: art-claims-scoped-to-visual-evidence
    title: An art claim stays scoped to what visual evidence can establish
    kind: professional_knowledge
    statement: Art's own evidence can establish whether a visual element matches the established visual rule set and reads clearly, including whether a telegraph or readability cue is legible; whether the resulting gameplay moment is appropriately difficult or feels right is a separate, game-design-owned claim that visual quality alone does not confirm, even when the visual work is what carries the telegraph.
    domain_ids: [art, game_art]
    capability_ids: [art_direction, visual_development]
    source_ids: [macdonald-visual-threshold]
    method_ids: [art-claim-boundary-review]
    freshness_class: stable
    confidence: 0.87
