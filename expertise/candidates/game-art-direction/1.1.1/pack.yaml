description: >-
  Visual-hierarchy and cross-set consistency review for concept, environment, and
  UI art, grounded in general graphic-design composition principles; explicit
  pipeline-stage tracking for art assets grounded in the Scrum Guide;
  functional-visual-stereotype-versus-cliche discrimination and cross-medium
  visual identity consistency, grounded in a shipped triple-A art director's
  account of building and maintaining a game's visual design rule set (Stuart
  Macdonald, Art Director on Quantum Break at Remedy Entertainment); and, new
  in this version, recognizing when a status claim about gameplay feel (is an
  encounter appropriately hard) is being asserted on the strength of visual
  work alone, when it actually belongs to game design's own evidence.
