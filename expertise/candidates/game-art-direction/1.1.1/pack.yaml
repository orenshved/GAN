# K4 Part C: cross-disciplinary boundary-recognition benchmark.
# state: draft — NOT installed, NOT reviewed, NOT trusted for routing.
# See docs/K4_LEAD_METHODOLOGY_ONTOLOGY_REVIEW.md and
# .ai/handoffs/claude-to-codex.md.
#
# Adds a benchmark testing whether art-lead recognizes when a status update
# bundles a genuine visual claim (is the telegraph animation legible) with a
# gameplay-feel claim (is the encounter appropriately hard) that belongs to
# game-design-lead's domain, not art's. No new source: Macdonald's talk
# already frames the art director's authority as scoped to the visual design
# rule set specifically, not to gameplay outcomes the visual work supports —
# this is a direct corollary of that framing, not a new claim. One item
# added to state it explicitly; sources, methods, and all other items are
# unchanged from 1.1.0.
