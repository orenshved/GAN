# game-specific art-direction standard was found (GDC Vault talks are largely
# paywalled; most practitioner books have no free web edition). The primary
# source here is a general graphic-design textbook, not games-specific — that
# gap is real and stated honestly, the same treatment WCAG got in
# game-ux-core ("no game-specific UX authority"). `asset_tracking` reuses the
# already-verified Scrum Guide source from game-production-core, since
# pipeline-stage tracking is a production discipline, not an art-theory one.
