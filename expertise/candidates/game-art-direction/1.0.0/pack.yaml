version: 1.0.0
description: >-
  Visual-hierarchy and cross-set consistency review for concept, environment,
  and UI art, grounded in general graphic-design composition principles, plus
  explicit pipeline-stage tracking for art assets grounded in the Scrum
  Guide. Neither source is game-specific; both are applied to game art
  deliberately, not assumed to transfer without adaptation.
