  - schema_version: 1
    item_id: engineering-no-structural-overclaim
    title: Structural inspection is bounded evidence
    kind: anti_pattern
    statement: Readable source and configuration establish discoverability, not runtime correctness, performance, or player-facing quality.
    domain_ids: [engineering, qa]
    capability_ids: [dependency_analysis, build_engineering]
    source_ids: [gan-evidence-contract]
    method_ids: [dependency-boundary-review]
    freshness_class: stable
    confidence: 0.99
  - schema_version: 1
    item_id: engineering-component-over-inheritance
    title: Prefer component composition over deep gameplay inheritance
    kind: professional_knowledge
    statement: Entities with many optional, cross-cutting behaviors (movement, health, AI, rendering) are usually better composed from independent components than a deep inheritance chain, because inheritance forces every combination of behaviors to be anticipated as a named subclass in advance.
    domain_ids: [engineering, game_engineering]
    capability_ids: [gameplay_engineering, ui_engineering]
    source_ids: [game-programming-patterns-book]
    method_ids: [game-architecture-pattern-review]
    freshness_class: stable
    confidence: 0.9
  - schema_version: 1
    item_id: engineering-game-loop-order-explicit
    title: Game-loop update order is an explicit contract
    kind: standard
    statement: The order in which a game loop updates and renders entities (fixed versus variable timestep, update-then-render versus interleaved) is a deliberate architectural decision affecting determinism, and must be stated explicitly rather than left to incidental call order.
    domain_ids: [engineering, game_engineering]
    capability_ids: [gameplay_engineering, build_engineering]
    source_ids: [game-programming-patterns-book]
    method_ids: [game-architecture-pattern-review]
    freshness_class: stable
    confidence: 0.92
  - schema_version: 1
    item_id: engineering-service-locator-hides-coupling
    title: Global service access hides coupling
    kind: anti_pattern
    statement: Reaching a subsystem through a globally accessible locator or singleton instead of an explicit dependency makes coupling invisible at the call site and complicates testing and lifecycle control; prefer explicit dependencies unless the pattern's documented trade-offs are a consciously accepted exception.
    domain_ids: [engineering, game_engineering]
    capability_ids: [gameplay_engineering, dependency_analysis]
    source_ids: [game-programming-patterns-book]
    method_ids: [game-architecture-pattern-review, dependency-boundary-review]
    freshness_class: stable
    confidence: 0.88
