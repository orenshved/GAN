    title: Concept art should have a traceable path into the final asset
    kind: professional_knowledge
    statement: Concept art is most valuable in production when it directly informs or is directly integrated into the final in-game asset, for example painted over an actual level-design screenshot, rather than existing only as a disconnected pre-production reference the final art loosely resembles.
