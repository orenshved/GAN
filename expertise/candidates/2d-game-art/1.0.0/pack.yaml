  - schema_version: 1
    item_id: art-constraint-solved-without-abandoning-style
    title: A technical constraint can be solved without abandoning the intended style
    kind: heuristic
    statement: When a desired visual effect is not achievable within the primary medium's direct limitations, for example flowing hair animated naively in 2D, a mixed-technique workaround such as compositing a limited 3D element into a 2D scene can preserve the intended look without compromising the overall style, at the cost of a bounded, deliberately time-boxed technical investment to validate feasibility first.
