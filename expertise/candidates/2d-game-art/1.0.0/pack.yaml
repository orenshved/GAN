methods:
  - schema_version: 1
    method_id: concept-to-ingame-pipeline-review
    title: Concept-to-in-game pipeline review
    purpose: Check that a game's environment or character art has a traceable path from mood board and concept art into the actual in-game asset, rather than concept art existing only as a disconnected pre-production reference.
    applicable_capability_ids: [illustration]
    steps:
      - Confirm a mood board or early concept exists establishing the intended mood or style for the environment or asset before detailed concept art begins.
      - Confirm the concept art directly informed, or was directly integrated into, the in-game asset, for example through a paint-over pass on an actual level-design screenshot, rather than remaining a separate, disconnected reference image.
      - Identify whether a single polished target render milestone exists that stakeholders can use to judge whether production art is on track toward the intended final quality.
      - Where feedback on the art direction is vague, for example only "it's beautiful," press for a specific, nameable point of visual identity the style can be summarized by, rather than accepting general praise as sufficient direction.
    evidence_requirements:
      - The actual mood board or concept art and the in-game asset it is meant to have informed, side by side.
      - Whether a target render milestone exists and what stage of production it was created at.
    source_ids: [child-of-light-gdc-talk]
  - schema_version: 1
    method_id: character-iconography-consistency-review
    title: Character iconography consistency review
    purpose: Evaluate whether a character design remains recognizable through iteration and in-fiction visual change by checking for a small set of preserved, iconic identifying elements rather than overall painterly likeness.
    applicable_capability_ids: [character_art]
    steps:
      - Identify the specific elements, such as silhouette, a signature prop, hairstyle, or color, intended to make the character recognizable even at small scale or high abstraction.
      - Confirm those specific elements are preserved across major redesign iterations or in-fiction transformations, even when other aspects of the design change substantially.
      - When a redesign is prompted by feedback such as "make the character more X," check the requested change against the project's own established creative pillars before adopting it, rather than accepting all external notes by default.
      - For a culturally-derived character concept, verify it is grounded in an actual informed source, such as a team member's lived background or documented folklore research, rather than a surface-level aesthetic borrowing.
    evidence_requirements:
      - The character's design across its iteration history, with the preserved identifying elements called out explicitly.
      - For culturally-derived designs, the specific source of authority behind the cultural elements used.
    source_ids: [child-of-light-gdc-talk, guacamelee-art-interview]
