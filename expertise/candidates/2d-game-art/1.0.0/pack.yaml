    item_id: art-weigh-feedback-against-pillars
    title: Weigh redesign feedback against the project's own creative pillars
    kind: standard
    statement: External feedback requesting a character be made more generically appealing, for example "more badass," should be evaluated against whether it fits the specific project's established creative intent, not adopted by default; a change that does not serve the project's own identity can be declined even when it is common advice elsewhere.
