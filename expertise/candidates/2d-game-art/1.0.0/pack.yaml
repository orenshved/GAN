  - schema_version: 1
    item_id: art-cultural-authenticity-needs-informed-source
    title: Cultural authenticity comes from an actual informed source, not aesthetic borrowing
    kind: professional_knowledge
    statement: A culturally-grounded art style and character concept is more defensible when it is driven by a team member's actual lived background or documented research into the specific culture, rather than an externally applied aesthetic without that grounding.
