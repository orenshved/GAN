  - schema_version: 1
    item_id: art-recognizability-needs-few-elements
    title: Recognizability depends on a few preserved iconic elements, not overall fidelity
    kind: professional_knowledge
    statement: A character stays recognizable across redesigns, abstraction, or in-fiction transformation by preserving a small set of specific identifying elements, such as silhouette, a signature prop, hairstyle, or color, not by preserving the overall painterly likeness of any single version.
