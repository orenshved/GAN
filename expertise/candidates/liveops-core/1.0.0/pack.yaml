methods:
  - schema_version: 1
    method_id: liveops-maturity-and-iteration-review
    title: LiveOps maturity and iteration review
    purpose: Assess whether a live game's operational practice matches its actual maturity level, and check that "iteration" is not being confused with pre-planned content delivery on a fixed schedule.
    applicable_capability_ids: [liveops_design]
    steps:
      - Distinguish genuine iteration, small and frequent changes made in direct response to player feedback and behavioral data, from planned content delivery on a fixed schedule, which is a different activity even though both happen post-launch.
      - Check whether a team attempting segmentation or personalization-driven optimization has first established basic iteration capability; data-driven personalization is very difficult to act on without an existing ability to make frequent game changes.
      - When player behavior diverges sharply from the intended design, check whether the response is grounded in actual engagement or retention data about that behavior, rather than an assumption that the divergence must be suppressed to match original intent.
      - For a game far along in its live-service life, check whether engagement is being designed for beyond active play time, such as community and fan experiences, rather than only within game systems.
    evidence_requirements:
      - Which maturity tier the practice under review actually reflects, and whether claimed "iteration" is genuinely feedback-responsive or a relabeled fixed content schedule.
      - Any behavioral or retention data backing a response to emergent player behavior under review.
    source_ids: [cox-beyond-gaas-liveops-gdc2020]
  - schema_version: 1
    method_id: live-content-cadence-and-timing-review
    title: Live content cadence and timing review
    purpose: Check that a live game's content release cadence and balance-change timing follow the documented practices that drove sustained growth for a long-running live-service title, rather than treating release timing and balance timing as unimportant.
    applicable_capability_ids: [liveops_design, live_operations]
    steps:
      - Confirm the release cadence is fixed and predictable, a stated, consistent interval, rather than variable in size and timing, since players need to be able to plan around, and return for, a known next date.
      - Check that a content release is batched with enough marketable substance to be worth players and press noticing, rather than delivered as a small patch that improves the game without moving engagement.
      - Confirm balance changes affecting an active competitive or build-choice meta are scheduled for the boundary between content cycles, not mid-cycle, since players who already committed to a build or strategy under the prior balance experience mid-cycle changes as unfair.
      - Check whether monetization and re-engagement efforts are concentrated toward the start of a content cycle, when a fresh start or new content gives players their clearest reason to return.
    evidence_requirements:
      - The actual cadence and size history of recent releases, checked for predictability.
      - The timing of any planned balance changes relative to the current content cycle's boundaries.
    source_ids: [wilson-poe-played-forever-gdc2019]
items:
  - schema_version: 1
    item_id: iteration-is-not-the-same-as-planned-content-delivery
    title: Iteration is not the same as delivering pre-planned content on a schedule
    kind: professional_knowledge
    statement: Genuine live-operations iteration means small, frequent changes made in direct response to player feedback and behavioral data; delivering pre-planned content on a fixed schedule, however frequently, is a different activity, a slow-cadence form of production, and should not be mistaken for the feedback loop live operations is actually built around.
