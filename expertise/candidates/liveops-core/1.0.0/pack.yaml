  - schema_version: 1
    item_id: personalization-requires-iteration-capability-first
    title: Personalization requires iteration capability to already be in place
    kind: professional_knowledge
    statement: Segmentation and data-driven personalization are difficult to act on productively without an existing ability to make frequent, low-friction changes to the game; teams that attempt sophisticated targeting before establishing basic iteration capability tend to collect data they cannot actually use.
    domain_ids: [liveops, game_liveops]
    capability_ids: [liveops_design]
    source_ids: [cox-beyond-gaas-liveops-gdc2020]
    method_ids: [liveops-maturity-and-iteration-review]
    freshness_class: stable
    confidence: 0.85
  - schema_version: 1
    item_id: emergent-player-behavior-needs-a-data-grounded-response
    title: Emergent player behavior needs a data-grounded response, not an assumption
    kind: professional_knowledge
    statement: When players adopt a strategy or behavior far outside a system's intended design, the productive response is to check whether that behavior actually correlates with genuine engagement or enjoyment before deciding whether to suppress it or support it; treating a divergence from design intent as automatically undesirable risks removing something players have organically found fun.
    domain_ids: [liveops, game_liveops]
    capability_ids: [liveops_design]
    source_ids: [cox-beyond-gaas-liveops-gdc2020]
    method_ids: [liveops-maturity-and-iteration-review]
    freshness_class: stable
    confidence: 0.87
  - schema_version: 1
    item_id: mastery-phase-extends-engagement-beyond-play-time
    title: The most advanced live-ops practice extends engagement beyond active play time
    kind: professional_knowledge
    statement: The most advanced live-operations practice treats a game's engagement as extending beyond active play sessions into community, fan content, and shared social experience; designing deliberately for this layer, rather than treating it as an unplanned side effect, is what drives organic growth and reduces reliance on paid acquisition.
    domain_ids: [liveops, game_liveops]
    capability_ids: [liveops_design]
    source_ids: [cox-beyond-gaas-liveops-gdc2020]
    method_ids: [liveops-maturity-and-iteration-review]
    freshness_class: stable
    confidence: 0.83
  - schema_version: 1
    item_id: predictable-cadence-lets-players-plan-their-return
    title: A predictable cadence lets a disengaging player plan their return
    kind: professional_knowledge
    statement: A live game's content releases should follow a fixed, predictable interval rather than variable timing and scope, since a predictable schedule lets a player who is about to disengage plan a specific return date instead of burning out or leaving without any intention to come back.
    domain_ids: [liveops, game_liveops]
    capability_ids: [liveops_design, release_management]
    source_ids: [wilson-poe-played-forever-gdc2019]
    method_ids: [live-content-cadence-and-timing-review]
    freshness_class: stable
    confidence: 0.89
  - schema_version: 1
    item_id: small-frequent-patches-dont-move-engagement-alone
    title: Small frequent patches do not reliably move engagement on their own
    kind: anti_pattern
    statement: Small, frequent content patches improve a game and are worth continuing, but on their own they do not reliably move aggregate engagement or player-count metrics; the content that moves those numbers needs to be batched into a release substantial enough for players and press to actually notice and talk about.
    domain_ids: [liveops, game_liveops]
    capability_ids: [liveops_design]
    source_ids: [wilson-poe-played-forever-gdc2019]
    method_ids: [live-content-cadence-and-timing-review]
    freshness_class: stable
    confidence: 0.86
  - schema_version: 1
    item_id: mid-cycle-balance-changes-feel-unfair
    title: Mid-cycle balance changes are experienced as unfair, regardless of merit
    kind: anti_pattern
    statement: Balance changes made in the middle of an active content cycle are experienced as unfair by players who already committed to a build or strategy under the prior balance, regardless of whether the change is a genuine improvement; holding balance changes for a cycle boundary, where they become part of a fresh, visible choice, avoids this specific failure mode.
    domain_ids: [liveops, game_liveops]
    capability_ids: [liveops_design, live_operations]
    source_ids: [wilson-poe-played-forever-gdc2019]
    method_ids: [live-content-cadence-and-timing-review]
    freshness_class: stable
    confidence: 0.87
  - schema_version: 1
    item_id: monetization-concentrates-at-cycle-start
    title: Monetization and re-engagement effort concentrates at the start of a cycle
    kind: standard
    statement: Concentrating monetization and re-engagement efforts toward the start of a content cycle, when a fresh start or new content gives players their clearest reason to return and invest, is more effective than spreading effort evenly across the cycle, since players who disengage near a cycle's end are expected to return and monetize again at the start of the next one.
    domain_ids: [liveops, game_liveops]
    capability_ids: [live_operations]
    source_ids: [wilson-poe-played-forever-gdc2019]
