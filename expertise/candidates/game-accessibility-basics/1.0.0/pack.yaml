methods:
  - schema_version: 1
    method_id: pour-principle-classification
    title: POUR principle classification
    purpose: Classify an accessibility concern under the WCAG principle it actually belongs to — Perceivable, Operable, Understandable, or Robust — before proposing a fix, so the fix targets the barrier's real cause rather than a nearby symptom.
    applicable_capability_ids: [accessibility_ux, accessibility_qa]
    steps:
      - State the specific barrier a player faces in terms of what they cannot perceive, operate, understand, or reliably access via assistive technology.
      - Classify it under the POUR principle or principles it actually belongs to; most concerns map cleanly to one, some genuinely cross more than one.
      - Confirm a proposed fix addresses that principle specifically — a Perceivable problem is not resolved by an Operable-style fix.
      - Flag when a reported accessibility issue does not clearly map to any POUR principle, since that is a signal it may be a general usability complaint rather than an accessibility barrier specifically.
    evidence_requirements:
      - The specific barrier as reported or observed, described in terms of what a player cannot do.
      - Which POUR principle or principles it maps to, and why.
    source_ids: [wcag-pour-intro]
  - schema_version: 1
    method_id: conformance-level-scoping
    title: Conformance level scoping
    purpose: State an accessibility commitment at an explicit, defensible conformance level rather than an unscoped claim of "accessible," since the levels are cumulative and Level AAA is not achievable project-wide.
    applicable_capability_ids: [accessibility_ux, accessibility_qa]
    steps:
      - Identify which conformance level the project is actually committing to for a given surface, most commonly Level AA.
      - Confirm every applicable Level A criterion is met first; Level AA cannot be claimed while Level A gaps remain, since AA is cumulative on top of A.
      - Do not commit to Level AAA project-wide; treat any AAA claim as scoped to specific content, not the whole game, since W3C's own guidance acknowledges AAA is not achievable for all content.
      - Record which level is being claimed for which surface, rather than an unscoped statement that the game is accessible.
    evidence_requirements:
      - The specific conformance level being claimed and the surface, screen, mode, or whole game, it applies to.
      - Confirmation that lower cumulative levels are satisfied before a higher one is claimed.
    source_ids: [wcag-conformance-levels]
items:
  - schema_version: 1
    item_id: accessibility-barriers-classify-under-pour
    title: Accessibility barriers classify under one of four principles
    kind: professional_knowledge
    statement: Perceivable, Operable, Understandable, and Robust are not four separate checklists to run in parallel; they are the four ways a barrier can exist, and naming which one a specific barrier is helps target the right fix instead of a plausible-sounding but mismatched one.
    domain_ids: [accessibility]
    capability_ids: [accessibility_ux, accessibility_qa]
    source_ids: [wcag-pour-intro]
    method_ids: [pour-principle-classification]
    freshness_class: version_sensitive
    confidence: 0.9
  - schema_version: 1
    item_id: accessibility-conformance-is-cumulative
    title: Conformance levels are cumulative, not independent tiers
    kind: standard
    statement: Level AA conformance requires satisfying Level A first; the levels build on each other rather than offering three independent bars, so a Level AA claim with open Level A gaps is not a valid claim.
    domain_ids: [accessibility]
    capability_ids: [accessibility_ux, accessibility_qa]
    source_ids: [wcag-conformance-levels]
    method_ids: [conformance-level-scoping]
    freshness_class: version_sensitive
    confidence: 0.93
  - schema_version: 1
    item_id: accessibility-unscoped-claim-invalid
    title: An unscoped "accessible" claim is not a checkable claim
    kind: anti_pattern
    statement: Stating that a game is accessible without naming a conformance level and the surface it applies to is not a checkable claim; W3C's own guidance explicitly discourages committing to the highest level project-wide because not all content can satisfy every Level AAA criterion.
    domain_ids: [accessibility, qa]
    capability_ids: [accessibility_ux, accessibility_qa]
    source_ids: [wcag-conformance-levels]
    method_ids: [conformance-level-scoping]
    freshness_class: version_sensitive
    confidence: 0.92
  - schema_version: 1
    item_id: accessibility-unclassified-concern-check-usability
    title: A barrier with no clear POUR classification may not be an accessibility issue
    kind: professional_knowledge
    statement: If a reported concern cannot be mapped to Perceivable, Operable, Understandable, or Robust, it is worth checking whether it is actually a general usability complaint rather than an accessibility barrier specifically; the two categories overlap but are not identical.
    domain_ids: [accessibility, ux]
    capability_ids: [accessibility_ux]
