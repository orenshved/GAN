description: >-
  The WCAG POUR principle taxonomy (Perceivable, Operable, Understandable,
  Robust) and conformance-level structure (A, AA, AAA), applied to
  classifying accessibility barriers and scoping accessibility claims
  honestly, rather than treating "accessible" as an unscoped yes/no.
