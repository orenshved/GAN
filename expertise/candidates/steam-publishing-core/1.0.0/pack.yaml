methods:
  - schema_version: 1
    method_id: steam-release-staging-review
    title: Steam release staging review
    purpose: Check that a build intended for release is staged through a protected beta branch and actually tested there before being promoted to the default branch, and that its depot organization matches the content being shipped.
    applicable_capability_ids:
      [patching, deployment, packaging, platform_certification]
    steps:
      - Confirm the build under review was uploaded to a password-protected beta branch first, not set live on the default branch directly.
      - Confirm the beta branch was actually tested, via Steam's own beta opt-in mechanism or an equivalent, before promotion, rather than uploaded and assumed correct.
      - For an already-released title, confirm the team has planned for the additional account authorization Steam requires to promote a new build to the live default branch, rather than discovering it as a blocker at launch time.
      - Check that depot organization (platform-specific, language-specific, DLC-specific depots) matches the actual content being shipped, rather than bundling unrelated content into one depot.
    evidence_requirements:
      - The actual branch history for the build under review, including which beta branch was used and when it was promoted.
      - The current depot configuration compared against the content it is meant to contain.
    source_ids: [steamworks-builds-docs, steamworks-depots-docs]
  - schema_version: 1
    method_id: steam-launch-readiness-review
    title: Steam launch readiness review
    purpose: Check that a release plan includes the specific, easy-to-underestimate practices Valve's own platform team consistently flags as most consequential for Steam launches, rather than treating them as post-launch polish.
    applicable_capability_ids:
      [release_management, store_assets, publishing_support]
    steps:
      - Confirm the game has been playtested well in advance of launch, using a mechanism such as Steam Playtest, rather than for the first time at launch.
      - Confirm cross-device save continuity is enabled, since a majority of Steam users play across more than one device.
      - Confirm controller support is planned as a launch feature rather than deferred to after early access, given how much Steam play time happens via a gamepad.
      - Check that localization priorities are driven by actual wishlist or regional sales data rather than assumption, and that store page assets are localized alongside the game itself.
    evidence_requirements:
      - The release plan's playtest schedule, save-sync status, and controller support status.
      - The specific data used to prioritize which languages to localize first.
    source_ids: [valve-steam-platform-2026-gdc]
  - schema_version: 1
    method_id: steam-audience-building-review
    title: Steam audience building review
    purpose: Check that a developer or publisher's Steam presence is actively maintained rather than a one-time setup, since Steam's follow and notification mechanics only work if the page reflects the studio's actual current lineup.
    applicable_capability_ids: [publishing_support]
    steps:
      - Confirm a developer or publisher homepage exists and is linked to every current and announced title, not only the most recent one.
      - Check that the homepage has been reviewed or updated within a reasonable recent window rather than left untouched since initial setup.
      - Confirm announced but unreleased titles are represented on the homepage so existing followers are notified when they release.
    evidence_requirements:
      - The homepage's current content and last-updated status.
      - Whether every shipped or announced title is actually linked to it.
    source_ids: [valve-steam-platform-2026-gdc]
items:
