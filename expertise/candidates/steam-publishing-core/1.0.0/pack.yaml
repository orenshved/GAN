    confidence: 0.9
  - schema_version: 1
    item_id: default-branch-promotion-needs-extra-authorization
    title: Promoting a build to the live default branch requires extra authorization
    kind: professional_knowledge
    statement: For an already-released game, setting a new build live on the default branch requires additional account authorization beyond a normal upload; teams should plan for this step in their release timeline rather than treat it as a launch-day surprise.
    domain_ids: [publishing, game_publishing]
    capability_ids: [deployment, platform_certification]
    source_ids: [steamworks-builds-docs]
    method_ids: [steam-release-staging-review]
    freshness_class: version_sensitive
    confidence: 0.88
  - schema_version: 1
    item_id: depots-should-match-actual-content-boundaries
    title: Depot organization should match actual content boundaries
    kind: standard
    statement: Splitting content into separate depots by platform, language, and DLC lets Steam download only what a given customer actually needs; bundling unrelated content into a single depot forces unnecessary downloads and makes future updates harder to scope narrowly.
    domain_ids: [publishing, game_publishing]
    capability_ids: [packaging]
    source_ids: [steamworks-depots-docs]
    method_ids: [steam-release-staging-review]
    freshness_class: version_sensitive
    confidence: 0.87
  - schema_version: 1
    item_id: playtest-well-before-launch-not-at-launch
    title: Playtest well before launch, not for the first time at launch
    kind: professional_knowledge
    statement: A game should be playtested well in advance of its release, using a mechanism such as Steam Playtest, so that unanticipated issues can be budgeted for in the weeks and months before launch rather than discovered at the highest-stress, highest-risk moment of the release itself.
    domain_ids: [publishing, game_publishing]
    capability_ids: [release_management]
    source_ids: [valve-steam-platform-2026-gdc]
    method_ids: [steam-launch-readiness-review]
    freshness_class: stable
    confidence: 0.87
  - schema_version: 1
    item_id: cross-device-save-continuity-is-expected-not-optional
    title: Cross-device save continuity is expected, not optional
    kind: standard
    statement: Since a majority of Steam users play across more than one device, cross-device save continuity is a baseline expectation rather than a nice-to-have; losing progress when switching devices is a documented, concrete reason players disengage even from a strong demo or early access build.
    domain_ids: [publishing, game_publishing]
    capability_ids: [release_management]
    source_ids: [valve-steam-platform-2026-gdc]
    method_ids: [steam-launch-readiness-review]
    freshness_class: stable
    confidence: 0.85
  - schema_version: 1
    item_id: controller-support-is-consistently-underestimated
    title: Developers consistently underestimate controller support's importance
    kind: anti_pattern
    statement: Developers consistently underestimate how much play time on Steam happens via a controller and defer controller support to after early access or launch; given how large and steadily growing gamepad usage actually is, this is a documented mismatch between developer assumptions and actual player behavior, not a safe deferral.
    domain_ids: [publishing, game_publishing]
    capability_ids: [release_management]
    source_ids: [valve-steam-platform-2026-gdc]
    method_ids: [steam-launch-readiness-review]
    freshness_class: stable
    confidence: 0.85
  - schema_version: 1
    item_id: localization-priority-should-follow-actual-demand-data
    title: Localization priority should follow actual demand data, not assumption
    kind: professional_knowledge
    statement: Which languages to localize first should be driven by actual wishlist or regional sales data rather than assumption, since the languages generating the most player interest vary by title and are directly observable; store page assets should be localized alongside the game itself, not treated as a separate, lower-priority task.
    domain_ids: [publishing, game_publishing]
    capability_ids: [store_assets]
    source_ids: [valve-steam-platform-2026-gdc]
    method_ids: [steam-launch-readiness-review]
    freshness_class: stable
