    item_id: beta-branch-before-default-branch
    title: A build is tested on a beta branch before promotion to the default branch
    kind: professional_knowledge
    statement: A build should be uploaded and tested on a password-protected beta branch before being promoted to the default branch that live customers receive; uploading a new build directly to the default branch skips the staging step Steam's own build system is designed to support.
    domain_ids: [publishing, game_publishing]
    capability_ids: [patching, deployment]
    source_ids: [steamworks-builds-docs]
    method_ids: [steam-release-staging-review]
