methods:
  - schema_version: 1
    method_id: security-architecture-and-supply-chain-review
    title: Security architecture and supply chain review
    purpose: Check that a game's core architecture is built on an authoritative-server foundation with a game-specific threat model, and that third-party engines, libraries, and SDKs are formally vetted and correctly configured rather than trusted by reputation alone. Findings here are risk flags for further review, not a security clearance or certification.
    applicable_capability_ids: [security_review, vulnerability_management]
    steps:
      - Check whether the game's core architecture treats the server as authoritative for game-critical state rather than trusting client-reported state, since most other game-specific security properties depend on this as a foundation, and check whether the threat model is tailored to the game's actual abuse cases, cheating, economy exploitation, and griefing, rather than a generic web-application threat model that misses these patterns.
      - Check whether a new third-party engine, library, or SDK goes through a formal vetting process before integration, rather than being added on trust because the vendor is well known or the component is widely used elsewhere.
      - Check whether the project maintains a current software bill of materials listing exactly which third-party components and versions are integrated, since an out-of-date inventory cannot be reliably checked against a newly disclosed vulnerability.
      - Check whether each third-party SDK is actually configured according to its own provider's security recommendations, rather than left at default settings, since a well-vetted SDK can still introduce real risk if misconfigured, particularly around what data it collects and where it sends it.
    evidence_requirements:
      - Whether a documented threat model exists that names game-specific abuse cases, not only generic application security concerns.
      - A current inventory of integrated third-party components and versions, and evidence each was vetted before integration.
    source_ids: [owasp-game-security-framework-v0-5-1]
  - schema_version: 1
    method_id: player-data-and-access-control-review
    title: Player data and access control review
    purpose: Check that player data collection, storage, and administrative access are structured around minimization, masking, and enforced identity controls, and that account-takeover-style threats are treated as an active, ongoing risk rather than a login-screen afterthought. Findings here are risk flags for further review, not a security clearance or certification.
    applicable_capability_ids: [data_protection, access_control_review]
    steps:
      - Check whether sensitive player data is encrypted at rest and collected under a data-minimization principle, only what is actually needed for a specific purpose, rather than gathered broadly on the assumption that more data might be useful later.
      - Check whether administrative interfaces mask or otherwise protect personally identifiable information by default, requiring an explicit, logged authorization step to view it unmasked, rather than exposing it in full to any staff member who has interface access at all.
      - Check whether authentication for player accounts includes protections against credential-based attacks specifically, multi-factor authentication, password strength checked against known-breach databases, and secure session token handling, since stolen or guessed credentials being used to take over an account or penetrate the broader environment is a documented, active threat pattern in live game services.
      - Check whether regular players are structurally prevented from reaching administrative functionality, rather than merely not being shown a UI path to it, since an access boundary that depends only on hiding an option in the interface is not actually an access control.
    evidence_requirements:
      - What data-minimization and at-rest-encryption practices apply to sensitive player data.
      - Whether administrative access to unmasked player data requires an explicit, logged authorization step.
    source_ids:
      [
        owasp-game-security-framework-v0-5-1,
        adebambo-microsoft-gaming-ciso-ai-era-security-2025,
      ]
  - schema_version: 1
    method_id: network-attack-resilience-and-incident-monitoring-review
    title: Network attack resilience and incident monitoring review
    purpose: Check that a live multiplayer service is provisioned and instrumented to absorb and detect attacks in progress, rather than relying only on preventing them from ever starting. Findings here are risk flags for further review, not a security clearance or certification.
    applicable_capability_ids:
      [vulnerability_management, incident_response, access_control_review]
    steps:
      - Check whether a live multiplayer service's capacity plan includes deliberately provisioned spare capacity above normal peak load, sized using real stress-test scenarios rather than a guess, since it is this spare capacity, not detection and response alone, that actually absorbs the traffic volume of a denial-of-service attack in the critical first minutes.
      - Check whether resource-creation actions available to an individual player, such as creating new game sessions, are rate-limited per player, since without a limit a single player, or a small number of compromised accounts acting together, can exhaust shared server resources meant for the entire player base.
      - Check whether a player's connection is validated against a legitimately issued session token before it is accepted, rather than accepted on the basis of the request alone, since without this validation an attacker can hijack another player's already-reserved server slot.
      - Check whether security-relevant events, such as failed authentication attempts, account takeovers, and unusual economic activity, are logged to a secure, centrally aggregated location with defined alerting, using tamper-evident or immutable storage for anything that might later be needed for an investigation, rather than being left in local, uncorrelated logs.
    evidence_requirements:
      - The stress-test basis, if any, for the service's provisioned spare capacity above normal peak load.
      - Whether security-relevant events are aggregated to a central, monitored location with defined alerting, or only logged locally.
    source_ids:
      [
        leung-gamelift-ddos-protection-aws-blog,
        owasp-game-security-framework-v0-5-1,
      ]
