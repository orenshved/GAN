methods:
  - schema_version: 1
    method_id: monetization-model-tradeoff-review
    title: Monetization model tradeoff review
    purpose: Check that a monetization design choice states which of two fundamentally different growth strategies it is optimizing for, and that its actual community and reputational impact is being assessed alongside its financial metrics, not instead of them.
    applicable_capability_ids: [monetization]
    steps:
      - Identify which growth model a proposed monetization feature is actually optimizing for, a short-term revenue spike that will decay, or slower, sustained growth, and confirm this is a stated, deliberate choice rather than an unexamined default.
      - Check whether random-reward mechanics rely on obscuring the real price of a desired item through indirect sale, or on inserting artificial randomness noise specifically to mask an underlying pattern; name these techniques explicitly when present, rather than describing them only as randomization.
      - Confirm that a monetization change's actual community and reputational impact is being assessed, not only its retention, conversion, and revenue metrics, since a documented real case showed all three metrics can look healthy while a change still causes serious community and team-morale harm.
      - Check whether a currency or reward system avoids both letting value stack up indefinitely and letting earned value simply expire with nothing offered in return.
    evidence_requirements:
      - Which growth model the feature under review is optimizing for, stated explicitly.
      - The metrics being tracked for the decision, and whether community or reputational signals are included alongside financial ones.
    source_ids: [krasilnikov-dark-side-of-gacha-gdc2019]
  - schema_version: 1
    method_id: loot-box-disclosure-compliance-review
    title: Loot box disclosure compliance review
    purpose: Check that a randomized-purchase mechanic discloses the odds of each outcome to the player before purchase, and flag platform- or jurisdiction-specific compliance questions for Legal rather than resolving them independently.
    applicable_capability_ids: [monetization]
    steps:
      - Identify whether the mechanic under review offers randomized virtual items for purchase; if so, check whether the odds of each outcome type are disclosed to the player before the purchase is made, not only after.
      - Check that the disclosed odds match what the system actually implements, since a disclosed odds table that does not match real drop rates is a distinct and more serious problem than no disclosure at all.
      - Treat platform-specific or jurisdiction-specific requirements, which vary, as a compliance question for Legal to confirm, not something this review resolves on its own authority.
      - Flag price-discrimination patterns in personalized offers, such as different players seeing different prices for the same item, as a fairness question worth surfacing explicitly, even where no disclosure requirement technically applies.
    evidence_requirements:
      - Whether pre-purchase odds disclosure is present and matches the actual implemented rates.
      - Whether the specific platform or jurisdiction's requirements have been confirmed with Legal rather than assumed.
    source_ids: [apple-loot-box-odds-disclosure-guideline]
items:
  - schema_version: 1
    item_id: hype-model-vs-value-growth-model
    title: Monetization features tend toward a hype model or a value-growth model
    kind: professional_knowledge
    statement: Monetization features tend to fall into one of two broad patterns, a hype model producing a high initial revenue spike that decays quickly, or a value-growth model that sacrifices a fast spike for slower, more sustained revenue; which pattern a feature will produce is a real design choice with real tradeoffs, not an accident, and should be identified explicitly before it ships.
    domain_ids: [monetization, game_monetization]
    capability_ids: [monetization]
    source_ids: [krasilnikov-dark-side-of-gacha-gdc2019]
    method_ids: [monetization-model-tradeoff-review]
    freshness_class: stable
    confidence: 0.87
  - schema_version: 1
    item_id: indirect-sale-obscures-true-price
    title: Indirect sale obscures an item's true price from the player
    kind: anti_pattern
    statement: An indirect sale design, where a player spends money on randomized openings rather than purchasing a specific desired item directly, obscures that item's true price from the player, since the player does not know in advance how many openings will be needed; this is a documented, deliberate technique, not an incidental side effect of randomization, and should be named as such when it is used.
    domain_ids: [monetization, game_monetization]
    capability_ids: [monetization]
    source_ids: [krasilnikov-dark-side-of-gacha-gdc2019]
    method_ids: [monetization-model-tradeoff-review]
    freshness_class: stable
    confidence: 0.86
  - schema_version: 1
    item_id: artificial-randomness-noise-is-a-documented-technique
    title: Artificial randomness noise to mask patterns is a documented technique
    kind: anti_pattern
    statement: Deliberately inserting artificial randomness or noise into an offer or reward system specifically to prevent players from recognizing an underlying pattern is a documented monetization technique, distinct from randomness used for its own gameplay value; when present, it should be identified explicitly rather than described only as randomization.
    domain_ids: [monetization, game_monetization]
    capability_ids: [monetization]
    source_ids: [krasilnikov-dark-side-of-gacha-gdc2019]
    method_ids: [monetization-model-tradeoff-review]
    freshness_class: stable
    confidence: 0.85
  - schema_version: 1
    item_id: healthy-metrics-can-coexist-with-real-community-harm
    title: Healthy metrics can coexist with real, documented community harm
    kind: professional_knowledge
    statement: A monetization change's retention, conversion, and revenue metrics can all look healthy at the same time the change is causing serious, documented harm to community trust and team morale; a monetization review needs to check for community and reputational signals specifically, since financial metrics alone will not surface this kind of harm.
    domain_ids: [monetization, game_monetization]
    capability_ids: [monetization]
    source_ids: [krasilnikov-dark-side-of-gacha-gdc2019]
    method_ids: [monetization-model-tradeoff-review]
    freshness_class: stable
    confidence: 0.9
  - schema_version: 1
    item_id: currency-systems-should-avoid-hoarding-and-total-loss
    title: Currency systems should avoid both indefinite hoarding and total value loss
    kind: standard
    statement: A currency or token system designed for a specific redemption purpose should avoid both extremes, letting value stack up indefinitely with no reason to spend it, and letting earned value simply expire with nothing offered in return; a documented, effective middle path uses time-limited value with an explicit compensation mechanism when the time limit is reached.
    domain_ids: [monetization, game_monetization]
    capability_ids: [monetization]
    source_ids: [krasilnikov-dark-side-of-gacha-gdc2019]
    method_ids: [monetization-model-tradeoff-review]
    freshness_class: stable
    confidence: 0.84
  - schema_version: 1
    item_id: loot-box-odds-need-pre-purchase-disclosure
    title: Loot box odds need disclosure to the player before purchase
    kind: professional_knowledge
    statement: Major storefronts require that a randomized-purchase mechanic disclose the odds of each possible outcome to the player before the purchase is made, not only after; a monetization design that offers randomized items for money should be checked against this requirement explicitly, with platform- or jurisdiction-specific variations confirmed with Legal rather than assumed.
    domain_ids: [monetization, game_monetization]
    capability_ids: [monetization]
    source_ids: [apple-loot-box-odds-disclosure-guideline]
    method_ids: [loot-box-disclosure-compliance-review]
    freshness_class: version_sensitive
    confidence: 0.91
  - schema_version: 1
    item_id: disclosed-odds-must-match-actual-rates
    title: Disclosed odds must match the system's actual configured rates
    kind: anti_pattern
    statement: A disclosed odds table that does not match the rates a system actually implements is a more serious problem than having no disclosure at all, since it converts a transparency requirement into an active misrepresentation; disclosed odds should be checked against the system's actual configured rates, not assumed correct because a disclosure step happened once.
    domain_ids: [monetization, game_monetization]
    capability_ids: [monetization]
    source_ids: [apple-loot-box-odds-disclosure-guideline]
    method_ids: [loot-box-disclosure-compliance-review]
    freshness_class: version_sensitive
    confidence: 0.89
  - schema_version: 1
    item_id: personalized-price-discrimination-is-a-fairness-question
    title: Personalized price discrimination is a fairness question worth surfacing
    kind: professional_knowledge
    statement: Personalized offers that show different players different prices or discounts for the same item, even when not subject to a specific disclosure requirement, raise a fairness question worth surfacing explicitly once players are likely to compare notes and notice the difference; a design that would be difficult to justify if players discovered it deserves scrutiny before launch, not after a complaint.
    domain_ids: [monetization, game_monetization]
    capability_ids: [monetization]
    source_ids: [krasilnikov-dark-side-of-gacha-gdc2019]
