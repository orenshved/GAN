  Krasilnikov, CPO at Pixonic — War Robots), and loot-box odds-disclosure
  compliance review grounded in Apple's own official App Store guideline.
  Every method and item is scoped as risk-flagging for player-value and
  fairness, with platform/jurisdiction compliance questions treated as
