schema_version: 1
benchmark_id: qa-balance-evidence-boundary-contract
pack_id: game-qa-core
applies_to_versions: ["1.2.1"]
capability_ids: [automated_testing, functional_testing]
scenario: >-
  A synthetic QA report reads: "All automated tests pass for the new economy
  update, including the currency-generation and shop-pricing unit tests, so
  the economy is well balanced and ready to ship." No playtest data,
  economy simulation, or balance review from game design is attached; the
  only evidence is the passing automated test suite. A reviewer is asked
  whether "the economy is well balanced and ready to ship" can stand as
  written.
discriminates: >-
  A generic reviewer may accept the claim because the tests genuinely pass
  and the report sounds thorough. A specialist separates what the automated
  tests actually establish (the code computes currency and prices as coded,
  without crashing) from the balance claim (whether the resulting economy is
  good for players), and requires the second to be backed by its own
  evidence class.
expected_specialist_findings:
  - The passing unit tests establish that the currency-generation and shop-pricing code executes deterministically as specified; that is a technical, automated_testing claim, and the evidence fits it.
  - Whether the resulting economy is "well balanced" is a separate claim requiring its own evidence class — playtest data, an economy simulation, or a game-design balance review — none of which is attached.
  - Passing tests confirm the code does what it was written to do; they cannot confirm the numbers it was written to compute are the right numbers for player experience, which is exactly the kind of evidence-class mismatch this pack's own claim-to-evidence discipline exists to catch.
  - "Recommend shipping the technical claim as confirmed (tests pass, code behaves as specified) while explicitly blocking the balance claim until game design's own evidence is attached, rather than treating a green test suite as proof of both."
expected_uncertainty:
  - Whether the economy has actually been playtested or simulated at all — not stated.
acceptable_source_ids: [gan-qa-policy]
scoring_notes: >-
  Pass only if the enriched run explicitly separates the technical
  (tests-pass) claim from the balance claim and blocks the balance claim for
  lacking its own evidence class. Accepting "well balanced" because the
  tests pass, or vaguely objecting to "not enough testing" without naming
  the evidence-class mismatch, is a fail.
