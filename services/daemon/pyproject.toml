[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gameagent-daemon"
version = "0.0.1"
description = "Game Agent Network local project daemon and protocol"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
    "python-dotenv>=1.1,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.35,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.16,<2",
    "filelock>=3.18,<4",
    "pyyaml>=6,<7",
    "openai-codex==0.147.0",
]

[project.scripts]
gameagent = "gameagent.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.18,<2", "jsonschema>=4.25,<5", "types-jsonschema>=4.25", "httpx>=0.28,<1", "types-PyYAML>=6"]

[tool.hatch.build.targets.wheel]
packages = ["gameagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["gameagent"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
