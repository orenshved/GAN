[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gameagent-daemon"
version = "0.0.1"
description = "Game Agent Network foundation contracts; runtime begins in Phase 1"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3", "python-dotenv>=1.1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.18,<2", "jsonschema>=4.25,<5", "types-jsonschema>=4.25"]

[tool.hatch.build.targets.wheel]
packages = ["gameagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["gameagent"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
